<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Калории 52"/>
<title>Калории 52</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --pu:#7C3AED;--pu2:#9D5CF6;--pul:rgba(124,58,237,.12);
  --gr:#10B981;--grl:rgba(16,185,129,.12);
  --am:#F59E0B;--aml:rgba(245,158,11,.12);
  --rd:#EF4444;--rdl:rgba(239,68,68,.12);
  --bl:#3B82F6;--bll:rgba(59,130,246,.12);
  --pk:#EC4899;--cy:#06B6D4;--cyl:rgba(6,182,212,.12);
  --tx:#111827;--tx2:#6B7280;--tx3:#9CA3AF;
  --bg:#F3F4F6;--sf:#FFF;
  --bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.15);
  --r:16px;--rs:10px;
  --sh:0 2px 12px rgba(0,0,0,.07);--shl:0 8px 32px rgba(0,0,0,.14);
}
@media(prefers-color-scheme:dark){:root{
  --tx:#F9FAFB;--tx2:#9CA3AF;--tx3:#6B7280;
  --bg:#0F0F14;--sf:#1C1C28;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.14);
  --sh:0 2px 12px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Nunito',sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto}
.hdr{padding:50px 16px 12px;background:var(--sf);border-bottom:.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:900;letter-spacing:-.5px}
.logo span{background:linear-gradient(135deg,var(--pu),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:11px;font-weight:700;color:var(--tx3);margin-top:2px}
.av{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--pu);background:var(--pul);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover;display:none}
.av-ed{position:absolute;bottom:-1px;right:-1px;width:15px;height:15px;background:var(--pu);border-radius:50%;font-size:8px;display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none}
.nav{display:flex;background:var(--sf);border-top:.5px solid var(--bd);padding:5px 0 max(16px,env(safe-area-inset-bottom))}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;border:none;background:none;color:var(--tx3);font-size:8px;font-family:'Nunito',sans-serif;font-weight:800;transition:color .15s}
.ni.on{color:var(--pu)}.nic{font-size:18px;line-height:1;transition:transform .2s}.ni.on .nic{transform:scale(1.15)}
.scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:13px}
.pg{display:none}.pg.on{display:block}
.card{background:var(--sf);border-radius:var(--r);padding:15px;margin-bottom:11px;box-shadow:var(--sh)}
.lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:9px}
.f{margin-bottom:11px}.f:last-child{margin-bottom:0}
.f label{display:block;font-size:12px;font-weight:700;color:var(--tx2);margin-bottom:5px}
.f input,.f select{width:100%;padding:11px 13px;font-size:15px;font-family:'Nunito',sans-serif;font-weight:600;border:2px solid var(--bd2);border-radius:var(--rs);background:var(--bg);color:var(--tx);-webkit-appearance:none;transition:border-color .15s}
.f input:focus,.f select:focus{outline:none;border-color:var(--pu)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--bg);border-radius:var(--rs);padding:3px;gap:2px}
.sb{flex:1;padding:8px 4px;text-align:center;font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;border-radius:8px;cursor:pointer;color:var(--tx3);border:none;background:none;transition:all .15s}
.sb.on{background:var(--sf);color:var(--pu);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.btn{width:100%;padding:13px;font-size:14px;font-weight:900;font-family:'Nunito',sans-serif;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:linear-gradient(135deg,var(--pu),var(--pu2));color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.btn-g{background:linear-gradient(135deg,var(--gr),#059669);color:#fff}
.btn-o{background:linear-gradient(135deg,var(--am),#D97706);color:#fff}
.btn-r{background:linear-gradient(135deg,var(--rd),#DC2626);color:#fff}
.btn-ghost{background:var(--bg);color:var(--tx2);border:2px solid var(--bd2)}
.btn-sm{padding:7px 13px;font-size:12px;width:auto;border-radius:99px}
.mt{margin-top:10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.sc{border-radius:var(--r);padding:13px;color:#fff;overflow:hidden;position:relative}
.sc::after{content:'';position:absolute;top:-15px;right:-15px;width:65px;height:65px;background:rgba(255,255,255,.12);border-radius:50%}
.sc-l{font-size:10px;font-weight:700;opacity:.8;margin-bottom:3px}
.sc-v{font-size:22px;font-weight:900;line-height:1}
.sc-u{font-size:10px;font-weight:600;opacity:.7;margin-left:2px}
.sc1{background:linear-gradient(135deg,#7C3AED,#9D5CF6)}.sc2{background:linear-gradient(135deg,#10B981,#059669)}
.sc3{background:linear-gradient(135deg,#F59E0B,#D97706)}.sc4{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.gcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}
.gc{border-radius:var(--rs);padding:11px 6px;text-align:center;cursor:pointer;border:2px solid var(--bd);background:var(--sf);transition:all .15s}
.gc.on{border-color:var(--pu);background:var(--pul)}
.gc-t{font-size:9px;font-weight:800;color:var(--tx3);margin-bottom:2px}.gc.on .gc-t{color:var(--pu)}
.gc-n{font-size:17px;font-weight:900;color:var(--tx)}.gc.on .gc-n{color:var(--pu)}
.gc-s{font-size:9px;color:var(--tx3);font-weight:700;margin-top:2px}
.mac{margin-bottom:10px}
.mac-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.mac-n{font-size:13px;font-weight:700;color:var(--tx2)}.mac-v{font-size:13px;font-weight:900}
.bar{height:7px;border-radius:99px;background:var(--bg);overflow:hidden}
.bf{height:100%;border-radius:99px;transition:width .5s ease}
.rgrid{display:grid;gap:10px}
.rc{background:var(--sf);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .15s}
.rc:active{transform:scale(.98)}
.rc-img{width:100%;height:135px;object-fit:cover;background:var(--bg)}
.rc-ph{width:100%;height:135px;display:flex;align-items:center;justify-content:center;font-size:50px;background:var(--bg)}
.rc-body{padding:11px}.rc-name{font-size:14px;font-weight:800;margin-bottom:5px}
.rc-row{display:flex;align-items:center;justify-content:space-between}
.rc-tags{display:flex;gap:4px;flex-wrap:wrap}
.rc-tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;background:var(--bg);color:var(--tx3)}
.rc-kcal{font-size:12px;font-weight:900;color:#fff;padding:3px 8px;border-radius:99px;background:linear-gradient(135deg,#EF4444,#F59E0B);white-space:nowrap}
.rc-macs{display:flex;gap:6px;margin-top:7px}
.rc-mac{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:5px 2px}
.rc-mv{font-size:12px;font-weight:900}.rc-mn{font-size:9px;font-weight:700;color:var(--tx3)}
.fit{display:inline-flex;align-items:center;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;margin-bottom:4px}
.fit-ok{background:var(--grl);color:var(--gr)}.fit-gd{background:var(--aml);color:var(--am)}.fit-hi{background:var(--rdl);color:var(--rd)}
.filt{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:11px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.chip{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;white-space:nowrap;cursor:pointer;border:2px solid var(--bd2);color:var(--tx2);background:var(--sf);transition:all .15s;flex-shrink:0}
.chip.on{background:var(--pu);color:#fff;border-color:var(--pu)}
/* PROGRESS */
.ph{background:linear-gradient(135deg,var(--pu),var(--pk));border-radius:var(--r);padding:15px;margin-bottom:11px;color:#fff}
.ph-t{font-size:17px;font-weight:900;margin-bottom:3px}.ph-s{font-size:12px;font-weight:600;opacity:.8}
.ph-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
.ps{background:rgba(255,255,255,.15);border-radius:10px;padding:9px 5px;text-align:center}
.ps-v{font-size:18px;font-weight:900}.ps-l{font-size:9px;font-weight:700;opacity:.8;margin-top:2px}
.ps-d{font-size:9px;font-weight:800;margin-top:2px}.ps-d.up{color:#FFD700}.ps-d.dn{color:#90EE90}
.cw{background:var(--sf);border-radius:var(--r);padding:13px;margin-bottom:11px;box-shadow:var(--sh)}
.ct-tabs{display:flex;gap:5px;margin-bottom:10px}
.ct{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer;border:2px solid var(--bd2);color:var(--tx3);background:none;font-family:'Nunito',sans-serif;transition:all .15s}
.ct.on{background:var(--pu);color:#fff;border-color:var(--pu)}
.pe{background:var(--sf);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
.pe-hd{display:flex;align-items:center;gap:10px;padding:12px}
.pe-ph{width:52px;height:52px;border-radius:10px;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;cursor:pointer}
.pe-ph img{width:100%;height:100%;object-fit:cover}
.pe-info{flex:1}.pe-date{font-size:12px;font-weight:800;margin-bottom:3px}
.pe-vals{display:flex;gap:7px}
.pe-val{font-size:11px;font-weight:700;color:var(--tx2)}.pe-val span{color:var(--pu);font-weight:900}
.pe-del{font-size:16px;color:var(--tx3);cursor:pointer;padding:4px}
.pe-big{width:100%;object-fit:cover;display:block;cursor:pointer;max-height:220px}
.af{background:var(--sf);border-radius:var(--r);padding:14px;margin-bottom:11px;box-shadow:var(--sh);border:2px dashed var(--bd2)}
.pup{width:100%;height:75px;border-radius:var(--rs);border:2px dashed var(--bd2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--bg);font-size:11px;font-weight:700;color:var(--tx3);overflow:hidden;position:relative}
.pup img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
/* CALCULATOR CONSTRUCTOR */
.cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.cat-card{border-radius:var(--rs);padding:12px 6px;text-align:center;cursor:pointer;border:2px solid var(--bd2);background:var(--sf);transition:all .15s}
.cat-card.on{border-color:var(--pu);background:var(--pul)}
.cat-ico{font-size:24px;margin-bottom:4px}
.cat-nm{font-size:11px;font-weight:800;color:var(--tx2)}.cat-card.on .cat-nm{color:var(--pu)}
.cat-cal{font-size:10px;font-weight:700;color:var(--tx3);margin-top:2px}.cat-card.on .cat-cal{color:var(--pu)}
.macro-targets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.mt-card{border-radius:var(--rs);padding:10px;text-align:center;background:var(--sf);box-shadow:var(--sh)}
.mt-v{font-size:18px;font-weight:900}
.mt-l{font-size:10px;font-weight:700;color:var(--tx3);margin-top:2px}
.mt-rem{font-size:11px;font-weight:800;margin-top:3px}
.food-option{border-radius:var(--rs);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px;cursor:pointer;border:2px solid var(--bd2);background:var(--sf);transition:all .15s;box-shadow:var(--sh)}
.food-option.ok{border-color:var(--gr);background:var(--grl)}
.food-option.warn{border-color:var(--am);background:var(--aml)}
.food-option.no{border-color:var(--rd);background:var(--rdl);opacity:.7}
.fo-ico{font-size:22px;width:38px;height:38px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fo-info{flex:1}
.fo-name{font-size:13px;font-weight:800;margin-bottom:2px}
.fo-desc{font-size:11px;font-weight:700;color:var(--tx2)}
.fo-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.fo-badge.ok{background:var(--gr);color:#fff}
.fo-badge.warn{background:var(--am);color:#fff}
.fo-badge.no{background:var(--rd);color:#fff}
.fo-gram{font-size:13px;font-weight:900;color:var(--pu);white-space:nowrap}
/* FOOD LOG */
.dt-n{font-size:46px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--pu),var(--pk));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dt-l{font-size:12px;font-weight:700;color:var(--tx3);margin-top:2px}
.dt-bar{height:9px;border-radius:99px;background:var(--bg);overflow:hidden;margin:9px 0 5px}
.dt-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gr),var(--pu));transition:width .4s}
.sw{position:relative;margin-bottom:10px}
.si{width:100%;padding:11px 13px 11px 38px;font-size:14px;font-family:'Nunito',sans-serif;font-weight:700;border:2px solid var(--bd2);border-radius:var(--rs);background:var(--bg);color:var(--tx);-webkit-appearance:none;transition:border-color .15s}
.si:focus{outline:none;border-color:var(--pu)}
.si-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.fres{background:var(--sf);border-radius:var(--r);box-shadow:var(--shl);margin-bottom:10px;overflow:hidden;display:none}
.fres.on{display:block}
.fri{padding:10px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--bd);cursor:pointer;transition:background .15s}
.fri:last-child{border-bottom:none}.fri:active{background:var(--bg)}
.fri-n{font-size:13px;font-weight:700}.fri-n small{display:block;font-size:10px;font-weight:600;color:var(--tx3);margin-top:1px}
.fri-k{font-size:13px;font-weight:900;color:var(--pu);white-space:nowrap}
.pr-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.pi{flex:1;padding:10px 12px;font-size:15px;font-family:'Nunito',sans-serif;font-weight:700;border:2px solid var(--bd2);border-radius:var(--rs);background:var(--bg);color:var(--tx);-webkit-appearance:none}
.pi:focus{outline:none;border-color:var(--pu)}
.fl-item{background:var(--sf);border-radius:var(--rs);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh)}
.fl-ico{font-size:20px;width:35px;height:35px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fl-info{flex:1}.fl-nm{font-size:13px;font-weight:800;margin-bottom:2px}.fl-dt{font-size:10px;font-weight:700;color:var(--tx3)}
.fl-macs{display:flex;gap:5px;margin-top:5px}
.fm{font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px}
.fm-p{background:var(--grl);color:var(--gr)}.fm-f{background:var(--aml);color:var(--am)}.fm-c{background:var(--bll);color:var(--bl)}
.fl-k{font-size:14px;font-weight:900;color:var(--pu);white-space:nowrap}.fl-del{font-size:15px;color:var(--tx3);cursor:pointer;padding:4px;flex-shrink:0}
/* CART */
.ci{background:var(--sf);border-radius:var(--rs);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh)}
.ci.done .ci-nm{text-decoration:line-through;color:var(--tx3)}
.ci-ico{font-size:20px;width:35px;height:35px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci-info{flex:1}.ci-nm{font-size:13px;font-weight:800;margin-bottom:2px}.ci-qty{font-size:12px;font-weight:700;color:var(--pu)}
.ci-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd2);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s}
.ci-chk.done{background:var(--gr);border-color:var(--gr);color:#fff}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
.mo.on{opacity:1;pointer-events:all}
.modal{background:var(--sf);border-radius:24px 24px 0 0;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.2,.64,1)}
.mo.on .modal{transform:translateY(0)}
.m-bar{width:36px;height:4px;background:var(--bd2);border-radius:99px;margin:12px auto 0}
.m-img{width:100%;height:195px;object-fit:cover}.m-ph{width:100%;height:170px;display:flex;align-items:center;justify-content:center;font-size:68px;background:var(--bg)}
.m-body{padding:15px 16px 40px}.m-title{font-size:20px;font-weight:900;margin-bottom:5px}
.m-kcal{font-size:30px;font-weight:900;background:linear-gradient(135deg,#EF4444,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.mpills{display:flex;gap:7px;margin-bottom:13px}
.mp{flex:1;border-radius:10px;padding:9px 3px;text-align:center}
.mp-p{background:linear-gradient(135deg,#10B981,#059669)}.mp-f{background:linear-gradient(135deg,#F59E0B,#D97706)}.mp-c{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.mp-v{font-size:16px;font-weight:900;color:#fff}.mp-n{font-size:9px;font-weight:700;color:rgba(255,255,255,.8)}
.sec-t{font-size:13px;font-weight:800;color:var(--tx2);margin:12px 0 7px}
.ir{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid var(--bd)}
.ir-ico{font-size:14px}.ir-name{flex:1;font-size:13px;font-weight:700}.ir-qty{font-size:12px;font-weight:800;color:var(--tx2);white-space:nowrap}
.ir-edit{font-size:11px;cursor:pointer;color:var(--pu);padding:2px 7px;border-radius:6px;background:var(--pul);font-weight:700;white-space:nowrap;border:none;font-family:'Nunito',sans-serif}
.stp{display:flex;gap:9px;margin-bottom:10px}
.sn{min-width:24px;height:24px;background:var(--pu);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:2px}
.st{font-size:13px;font-weight:600;line-height:1.5}
.eip{background:var(--sf);border-radius:var(--r);padding:13px;margin-top:10px;border:2px solid var(--pu);box-shadow:var(--shl)}
/* PHOTO FULLSCREEN */
.fs-ov{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.fs-ov.on{opacity:1;pointer-events:all}
.fs-img{max-width:100%;max-height:100%;object-fit:contain}
.fs-close{position:absolute;top:20px;right:20px;font-size:28px;color:#fff;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);border-radius:50%}
.welcome{background:linear-gradient(135deg,var(--pu),var(--pk));border-radius:var(--r);padding:15px;margin-bottom:11px;color:#fff;position:relative;overflow:hidden}
.welcome::after{content:'🥗';position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:42px;opacity:.2}
.wn{font-size:20px;font-weight:900;margin-bottom:2px}.ws{font-size:12px;font-weight:600;opacity:.8}
.ptitle{font-size:20px;font-weight:900;margin-bottom:12px;letter-spacing:-.3px}
.empty{text-align:center;padding:32px 14px}.empty-ico{font-size:46px;margin-bottom:10px}

@keyframes KB_out{to{opacity:0;pointer-events:none}}

@keyframes KB_pulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.18);opacity:1}}

.kb-splash{position:fixed;inset:0;z-index:9999;background:#09090F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:'Nunito',sans-serif}
.kb-splash.kb-out{animation:KB_out .45s ease forwards}
.kb-glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.38) 0%,transparent 68%);animation:KB_pulse 2.4s ease-in-out infinite}
.kb-title{font-size:38px;font-weight:900;color:#fff;letter-spacing:-1px;text-align:center;position:relative;z-index:2;opacity:0;animation:KB_rise .5s .05s ease forwards}
.kb-title em{font-style:normal;background:linear-gradient(135deg,#A78BFA,#EC4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kb-scene{width:200px;height:200px;position:relative;z-index:2;flex-shrink:0}
/* Dumbbell */
.kb-db{position:absolute;top:50%;left:50%;width:140px;height:30px;margin:-15px 0 0 -70px;animation:KB_spin 5s linear infinite}
.kb-bar{position:absolute;top:50%;left:50%;width:80px;height:7px;margin:-3.5px 0 0 -40px;background:linear-gradient(135deg,#9D5CF6,#7C3AED);border-radius:4px}
.kb-pl{position:absolute;top:50%;height:28px;width:16px;margin-top:-14px;border-radius:5px;background:linear-gradient(135deg,#9D5CF6,#EC4899)}
.kb-pl.l1{left:4px}.kb-pl.l2{left:0px;width:12px;height:22px;margin-top:-11px;background:#7C3AED}
.kb-pl.r1{right:4px}.kb-pl.r2{right:0px;width:12px;height:22px;margin-top:-11px;background:#7C3AED}
/* Icons */
.kb-ico{position:absolute;font-size:26px;z-index:3;opacity:0;transform-origin:center}
.kb-ico.i0{top:10px;left:10px;animation:KB_pop0 2.4s .7s ease infinite}
.kb-ico.i1{top:10px;right:10px;animation:KB_pop1 2.4s .7s ease infinite;display:inline-block}
.kb-ico.i1 span{display:inline-block;animation:KB_hb 1.1s ease infinite}
.kb-ico.i2{bottom:10px;left:10px;animation:KB_pop2 2.4s .7s ease infinite}
.kb-ico.i3{bottom:10px;right:10px;animation:KB_pop3 2.4s .7s ease infinite}
/* Bar */
.kb-bw{width:160px;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;position:relative;z-index:2}

<script>
// Splash - own script tag, runs immediately, independent of main JS
(function(){
  function hideSplash(){
    var el=document.getElementById('kb-splash');
    if(!el)return;
    el.style.transition='opacity .4s ease';
    el.style.opacity='0';
    setTimeout(function(){el.style.display='none';},420);
  }
  // Primary: hide when bar animation ends
  var bar=document.querySelector('.kb-bf');
  if(bar){
    bar.addEventListener('animationend',function(){
      setTimeout(hideSplash,200);
    });
  }
  // Fallback: always hide after 3s no matter what
  setTimeout(hideSplash,3000);
})();
</script>

(function(){
  try{

    if(p){pro=JSON.parse(p);gender=pro.gender;goal=pro.userGoal||'maintain';fillF();updHdr();}
    const e=localStorage.getItem('k52_en');if(e)entries=JSON.parse(e);
    const fl=localStorage.getItem('k52_fl_'+td());if(fl)foodLog=JSON.parse(fl);

    const ci=localStorage.getItem('k52_ci');if(ci)custIngr=JSON.parse(ci);

    const av=localStorage.getItem('k52_av');

      const ico=document.getElementById('av-ico');
      const img=document.getElementById('av-img');
      ico.style.display='none';img.src=av;img.style.display='block';
    }

  setG(gender,1);setGoal(goal,1);
  updCustomHint();
})();

function td(){return new Date().toISOString().slice(0,10)}
function sv(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}
  catch(x){showT('⚠️ Мало памяти. Очистите старые фото.');}
}

function fillF(){
  if(!pro)return;
  const map={name:'name','age':'a','height':'h','weight':'w','waist':'waist','hips':'hips'};
  Object.keys(map).forEach(id=>{
    const el=document.getElementById('f-'+id);
    if(el&&pro[map[id]]!=null)el.value=pro[map[id]];
  });
  if(document.getElementById('f-act'))document.getElementById('f-act').value=pro.act||1.55;
  if(document.getElementById('f-custom'))document.getElementById('f-custom').value=pro.customKcal||'';
  updCustomHint();
}

function updCustomHint(){
  const el=document.getElementById('f-custom');
  const hint=document.getElementById('custom-hint');
  if(!el||!hint)return;
  const v=parseInt(el.value)||0;
  if(v>0){hint.textContent='✅ Будет использоваться: '+v+' ккал/день';hint.style.color='var(--pu)';}
  else{hint.textContent='Оставьте пустым для автоматического расчёта';hint.style.color='var(--tx3)';}
}
if(document.getElementById('f-custom'))
  document.getElementById('f-custom').addEventListener('input',updCustomHint);

function updHdr(){
  if(!pro)return;
  document.getElementById('hdr-sub').textContent=pro.name?'Привет, '+pro.name+'! 👋':'Ваш личный нутрициолог';
  const av=localStorage.getItem('k52_av');
  if(!av)document.getElementById('av-ico').textContent=gender==='female'?'👩':'👨';
}

// ══════════════ AVATAR — compress & save ══════════════
function onAv(e){
  const file=e.target.files[0];if(!file)return;
  const img=new Image(),fr=new FileReader();
  fr.onload=ev=>{
    img.onload=()=>{
      const c=document.createElement('canvas');
      const max=180;let w=img.naturalWidth,h=img.naturalHeight;
      if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}
      else{if(h>max){w=Math.round(w*max/h);h=max;}}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      const data=c.toDataURL('image/jpeg',0.65);
      // Save to localStorage
      try{
        localStorage.setItem('k52_av',data);
        // Apply immediately
        document.getElementById('av-ico').style.display='none';
        const avImg=document.getElementById('av-img');
        avImg.src=data;avImg.style.display='block';
        showT('✅ Фото профиля сохранено');
      }catch(ex){showT('⚠️ Фото слишком большое, не сохранено');}
    };
    img.src=ev.target.result;
  };
  fr.readAsDataURL(file);
}

// ══════════════ PROFILE ══════════════
function setG(g,s){gender=g;document.getElementById('g-male').classList.toggle('on',g==='male');document.getElementById('g-female').classList.toggle('on',g==='female');}
function setGoal(g,s){goal=g;['lose','maintain','gain'].forEach(x=>document.getElementById('goal-'+x).classList.toggle('on',x===g));}
function bmrCalc(w,h,a,g){return g==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161}

function savePro(){
  const w=parseFloat(document.getElementById('f-weight').value);
  const h=parseFloat(document.getElementById('f-height').value);
  const a=parseFloat(document.getElementById('f-age').value);
  if(!w||!h||!a){showT('⚠️ Введите вес, рост и возраст');return;}
  const waist=parseFloat(document.getElementById('f-waist').value)||0;
  const hips=parseFloat(document.getElementById('f-hips').value)||0;
  const act=parseFloat(document.getElementById('f-act').value);
  const name=document.getElementById('f-name').value||'Пользователь';
  const customKcal=parseInt(document.getElementById('f-custom').value)||0;
  const bmrV=Math.round(bmrCalc(w,h,a,gender));
  const tdee=Math.round(bmrV*act);
  pro={name,w,h,a,waist,hips,gender,act,userGoal:goal,tdee,bmrV,
    bmi:w/((h/100)**2),customKcal,
    loseCals:Math.round(tdee*.8),gainCals:tdee+300};
  sv('k52_p',pro);updHdr();
  showT('✅ Профиль сохранён!');
  setTimeout(()=>go('dash'),700);
}

// ══════════════ NAVIGATION ══════════════

// ══════════════ CALORIES — always uses getCals() ══════════════
function getCals(){
  if(!pro)return null;

  if(goal==='lose')return pro.loseCals;
  if(goal==='gain')return pro.gainCals;

}

function selGoal(g){if(!pro)return;pro.userGoal=g;goal=g;sv('k52_p',pro);rDash();}

// ══════════════ RECIPES ══════════════
function scaleR(r,cals){
  const mt=cals*r.bp,ratio=Math.min(1.5,Math.max(.7,mt/r.kcal));
  return{...r,kS:Math.round(r.kcal*ratio),pS:Math.round(r.p*ratio),fS:Math.round(r.f*ratio),cS:Math.round(r.c*ratio),diff:Math.abs(r.kcal*ratio-mt),ratio};
}
function fitL(d){return d<30?{c:'fit-ok',t:'✅ Идеально'}:d<80?{c:'fit-gd',t:'👍 Подходит'}:{c:'fit-hi',t:'⚠️ Близко'};}

function rRec(){
  const el=document.getElementById('rec-b');const cals=getCals();
  const filters=[{id:'all',l:'Все'},{id:'breakfast',l:'Завтрак'},{id:'lunch',l:'Обед'},{id:'dinner',l:'Ужин'},{id:'snack',l:'Перекус'}];
  let list=RECIPES.filter(r=>rF==='all'||r.meal===rF);
  let sc=list.map(r=>cals?scaleR(r,cals):{...r,kS:r.kcal,pS:r.p,fS:r.f,cS:r.c,diff:999});
  sc.sort((a,b)=>a.diff-b.diff);
  el.innerHTML='<div class="ptitle">Рецепты 🍽️</div>'+(cals?'<div style="font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:10px">Порции под <span style="color:var(--pu)">'+cals+' ккал/день</span></div>':'')+'<div class="filt">'+filters.map(f=>'<div class="chip '+(rF===f.id?'on':'')+'" onclick="setRF(\''+f.id+'\')">'+f.l+'</div>').join('')+'</div><div class="rgrid">'+sc.map(r=>{const fit=cals?fitL(r.diff):null;return'<div class="rc" onclick="openRec('+r.id+')"><img class="rc-img" src="'+r.img+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"/><div class="rc-ph" style="display:none">'+r.emoji+'</div><div class="rc-body">'+(r.sat?'<span class="tag-sat">🔥 Насыщающее</span>':'')+(fit?'<div class="fit '+fit.c+'">'+fit.t+'</div>':'')+'<div class="rc-name">'+r.emoji+' '+r.name+'</div><div class="rc-row"><div class="rc-tags">'+r.tags.map(t=>'<span class="rc-tag">'+t+'</span>').join('')+'</div><div class="rc-kcal">'+r.kS+' ккал</div></div><div class="rc-macs"><div class="rc-mac"><div class="rc-mv" style="color:var(--gr)">'+r.pS+'г</div><div class="rc-mn">Белки</div></div><div class="rc-mac"><div class="rc-mv" style="color:var(--am)">'+r.fS+'г</div><div class="rc-mn">Жиры</div></div><div class="rc-mac"><div class="rc-mv" style="color:var(--bl)">'+r.cS+'г</div><div class="rc-mn">Углев.</div></div></div></div></div>';}).join('')+'</div>';
}
function setRF(f){rF=f;rRec();}

function getIngrs(rid){
  const r=RECIPES.find(x=>x.id===rid);
  const ov=custIngr[rid]||{};
  return r.ingredients.map((ing,i)=>ov[i]?{...ov[i],oi:i}:{...ing,oi:i});
}
function calcT(ingrs,ratio){
  let k=0,p=0,f=0,c=0;
  ingrs.forEach(ing=>{
    const fd=FOODS.find(x=>x.n===ing.n);
    if(!fd)return;const g=ing.q*ratio/100;
    k+=fd.k*g;p+=fd.p*g;f+=fd.f*g;c+=fd.c*g;
  });
  return{k:Math.round(k),p:Math.round(p),f:Math.round(f),c:Math.round(c)};
}
function rIngrs(ingrs,ratio){
  return ingrs.map((ing,i)=>'<div class="ir"><span class="ir-ico">'+ing.e+'</span><span class="ir-name">'+ing.n+'</span><span class="ir-qty">'+Math.round(ing.q*ratio)+' '+ing.u+'</span><button class="ir-edit" onclick="showEdit('+i+')">Заменить</button></div>').join('');
}
function openRec(id){
  editRid=id;
  const r0=RECIPES.find(x=>x.id===id),cals=getCals();
  const r=cals?scaleR(r0,cals):{...r0,kS:r0.kcal,ratio:1,diff:0};
  const ratio=r.ratio||1;const ingrs=getIngrs(id);const tot=calcT(ingrs,ratio);
  const fit=cals?fitL(r.diff):null;
  document.getElementById('m-in').innerHTML='<img class="m-img" src="'+r0.img+'" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"/><div class="m-ph" style="display:none">'+r0.emoji+'</div><div class="m-body">'+(fit?'<div class="fit '+fit.c+'" style="margin-bottom:7px">'+fit.t+'</div>':'')+(r0.sat?'<span class="tag-sat" style="display:inline-block;margin-bottom:8px">🔥 Насыщающее</span>':'')+'<div class="m-title">'+r0.emoji+' '+r0.name+'</div><div class="m-kcal" id="mk">'+tot.k+' ккал</div><div class="mpills"><div class="mp mp-p"><div class="mp-v" id="mp">'+tot.p+'г</div><div class="mp-n">Белки</div></div><div class="mp mp-f"><div class="mp-v" id="mf">'+tot.f+'г</div><div class="mp-n">Жиры</div></div><div class="mp mp-c"><div class="mp-v" id="mc">'+tot.c+'г</div><div class="mp-n">Углев.</div></div></div><div style="display:flex;justify-content:space-between;align-items:center"><div class="sec-t" style="margin-top:8px">🛒 Ингредиенты</div><button class="btn btn-o btn-sm" onclick="addToCart('+id+')">+ В корзину 🛒</button></div><div id="il">'+rIngrs(ingrs,ratio)+'</div><div id="ep"></div><div class="sec-t">👨‍🍳 Приготовление</div>'+r0.steps.map((s,i)=>'<div class="stp"><div class="sn">'+(i+1)+'</div><div class="st">'+s+'</div></div>').join('')+'</div>';
  document.getElementById('mo').classList.add('on');
}
function showEdit(idx){
  const rid=editRid,r0=RECIPES.find(x=>x.id===rid);
  const cals=getCals(),r=cals?scaleR(r0,cals):{...r0,ratio:1};
  const ingrs=getIngrs(rid),cur=ingrs[idx];
  document.getElementById('ep').innerHTML='<div class="eip"><div style="font-size:12px;font-weight:800;color:var(--tx2);margin-bottom:8px">Замена: <span style="color:var(--pu)">'+cur.n+'</span></div><div class="f"><label>Кол-во ('+cur.u+')</label><input type="number" id="ei-q" value="'+Math.round(cur.q)+'" inputmode="decimal"/></div><div class="sw"><span class="si-ico">🔍</span><input class="si" type="text" id="ei-s" placeholder="Продукт для замены..." oninput="srchE('+idx+')" autocomplete="off"/></div><div id="ei-r" class="fres"></div><button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="applyE('+idx+',null)">Только количество ✓</button></div>';
}
function srchE(idx){
  const q=document.getElementById('ei-s').value.toLowerCase().trim();
  const res=document.getElementById('ei-r');
  if(q.length<2){res.classList.remove('on');return;}
  const found=FOODS.filter(f=>f.n.toLowerCase().includes(q)).slice(0,5);
  res.innerHTML=found.map(f=>'<div class="fri" onclick="applyE('+idx+',\''+f.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')"><div class="fri-n">'+f.e+' '+f.n+'<small>Б:'+f.p+' Ж:'+f.f+' У:'+f.c+' на 100'+f.u+'</small></div><div class="fri-k">'+f.k+'кк</div></div>').join('');
  res.classList.add('on');
}
function applyE(idx,fname){
  const rid=editRid,r0=RECIPES.find(x=>x.id===rid);
  const cals=getCals(),r=cals?scaleR(r0,cals):{...r0,ratio:1};
  const ratio=r.ratio||1,ingrs=getIngrs(rid),cur=ingrs[idx];
  const qty=parseFloat(document.getElementById('ei-q').value)||cur.q;
  if(!custIngr[rid])custIngr[rid]={};
  if(fname){const fd=FOODS.find(x=>x.n===fname);custIngr[rid][idx]={n:fd.n,q:qty,u:fd.u,e:fd.e};}
  else{const ex=custIngr[rid][idx]||cur;custIngr[rid][idx]={...ex,q:qty};}
  sv('k52_ci',custIngr);
  const ni=getIngrs(rid),tot=calcT(ni,ratio);
  document.getElementById('il').innerHTML=rIngrs(ni,ratio);
  document.getElementById('mk').textContent=tot.k+' ккал';
  document.getElementById('mp').textContent=tot.p+'г';
  document.getElementById('mf').textContent=tot.f+'г';
  document.getElementById('mc').textContent=tot.c+'г';
  document.getElementById('ep').innerHTML='';
  showT('✅ Обновлено, КБЖУ пересчитано');
}

// ══════════════ CART ══════════════
function addToCart(rid){
  const r=RECIPES.find(x=>x.id===rid);
  const ex=cart.find(c=>c.rid===rid);
  if(ex)ex.qty++;else cart.push({rid,qty:1,name:r.name,emoji:r.emoji});
  sv('k52_ca',cart);showT('✅ "'+r.name+'" в корзину');
}
function buildShop(){
  const list={};
  cart.forEach(item=>{
    const ingrs=getIngrs(item.rid);
    const r0=RECIPES.find(x=>x.id===item.rid);
    const cals=getCals();
    const ratio=(cals?scaleR(r0,cals).ratio:1)*item.qty;
    ingrs.forEach(ing=>{
      if(!list[ing.n])list[ing.n]={n:ing.n,e:ing.e,qty:0,u:ing.u};
      list[ing.n].qty+=ing.q*ratio;
    });
  });
  return Object.values(list).map(x=>({...x,qty:Math.ceil(x.qty)}));
}
function rCart(){
  const el=document.getElementById('cart-b');
  const shop=cart.length>0?buildShop():[];
  el.innerHTML='<div class="ptitle">🛒 Корзина</div>'+
  (cart.length===0?'<div class="empty"><div class="empty-ico">🛒</div><p>Добавьте блюда из <a onclick="go(\'rec\')">рецептов</a></p></div>':
  '<div class="card"><div class="lbl">Выбранные блюда</div>'+
  cart.map((c,i)=>{const r=RECIPES.find(x=>x.id===c.rid);return'<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--bd)"><span style="font-size:22px">'+r.emoji+'</span><div style="flex:1"><div style="font-size:13px;font-weight:800">'+r.name+'</div></div><div style="display:flex;align-items:center;gap:8px"><button onclick="chgQ('+i+',-1)" style="width:26px;height:26px;border-radius:50%;border:2px solid var(--bd2);background:var(--bg);font-size:14px;cursor:pointer;font-weight:900">−</button><span style="font-size:14px;font-weight:900;color:var(--pu)">'+c.qty+'</span><button onclick="chgQ('+i+',1)" style="width:26px;height:26px;border-radius:50%;border:2px solid var(--bd2);background:var(--bg);font-size:14px;cursor:pointer;font-weight:900">+</button><span onclick="rmCart('+i+')" style="font-size:15px;color:var(--tx3);cursor:pointer;padding:4px">✕</span></div></div>';}).join('')+
  '<button class="btn btn-ghost btn-sm mt" onclick="clrCart()">Очистить 🗑️</button></div>'+
  '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="lbl" style="margin-bottom:0">Список покупок</div><button class="btn btn-sm btn-ghost" onclick="unchk()">Сбросить ✓</button></div>'+
  shop.map((item,i)=>'<div class="ci '+(chkd.has(item.n)?'done':'')+'" id="cii-'+i+'"><div class="ci-ico">'+item.e+'</div><div class="ci-info"><div class="ci-nm">'+item.n+'</div><div class="ci-qty">'+item.qty+' '+item.u+'</div></div><div class="ci-chk '+(chkd.has(item.n)?'done':'')+'" onclick="tglChk(\''+item.n.replace(/'/g,"\\'")+'\','+i+')">'+(chkd.has(item.n)?'✓':'')+'</div></div>').join('')+'</div>');
}
function chgQ(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);sv('k52_ca',cart);rCart();}
function rmCart(i){cart.splice(i,1);sv('k52_ca',cart);rCart();}
function clrCart(){cart=[];chkd=new Set();sv('k52_ca',cart);rCart();}
function tglChk(n){if(chkd.has(n))chkd.delete(n);else chkd.add(n);rCart();}
function unchk(){chkd=new Set();rCart();}

// ══════════════ PROGRESS ══════════════
function rProg(){
  const el=document.getElementById('prog-b');
  const lat=entries[entries.length-1],prev=entries[entries.length-2];
  const dlt=(f)=>{
    if(!lat||!prev||!lat[f]||!prev[f])return'';
    const d=lat[f]-prev[f],s=d>0?'+':'';
    const cls=f==='weight'?(d<0?'dn':'up'):(d<0?'dn':'up');
    return'<div class="ps-d '+cls+'">'+s+d.toFixed(1)+'</div>';
  };
  el.innerHTML='<div class="ph"><div class="ph-t">📈 Мой прогресс</div><div class="ph-s">Вносите замеры раз в неделю</div><div class="ph-stats"><div class="ps"><div class="ps-v">'+(lat?lat.weight||'—':'—')+'</div><div class="ps-l">Вес, кг</div>'+dlt('weight')+'</div><div class="ps"><div class="ps-v">'+(lat?lat.waist||'—':'—')+'</div><div class="ps-l">Талия, см</div>'+dlt('waist')+'</div><div class="ps"><div class="ps-v">'+(lat?lat.hips||'—':'—')+'</div><div class="ps-l">Бёдра, см</div>'+dlt('hips')+'</div></div></div>'+
  (entries.length>1?rChart():'')+
  '<div class="af"><div class="lbl" style="margin-bottom:10px">➕ Добавить замер</div><div class="f"><label>Дата</label><input type="date" id="pe-d" value="'+td()+'"/></div><div class="fr3"><div class="f"><label>Вес (кг)</label><input type="number" id="pe-w" placeholder="70" inputmode="decimal" step=".1"/></div><div class="f"><label>Талия</label><input type="number" id="pe-wa" placeholder="80" inputmode="numeric"/></div><div class="f"><label>Бёдра</label><input type="number" id="pe-hi" placeholder="100" inputmode="numeric"/></div></div><div class="f"><label>Фото</label><div class="pup" id="pe-pa" onclick="document.getElementById(\'pe-pf\').click()"><span style="font-size:20px">📷</span><span>Добавить фото</span><input type="file" id="pe-pf" accept="image/*" onchange="onPP(event)" style="display:none"/></div></div><button class="btn btn-p mt" onclick="addE()">Сохранить замер</button></div>'+
  (entries.length>0?'<div class="card"><div class="lbl">История замеров</div>'+
  [...entries].reverse().map((e,ri)=>{
    const i=entries.length-1-ri;
    return'<div class="pe"><div class="pe-hd"><div class="pe-ph" onclick="'+(e.photo?'openFs(\''+e.photo.substring(0,50)+'idx'+i+'\')':'')+'">'+
    (e.photo?'<img src="'+e.photo+'" onclick="openFsI('+i+')" style="cursor:pointer"/>':'📅')+
    '</div><div class="pe-info"><div class="pe-date">'+fmtD(e.date)+'</div><div class="pe-vals">'+
    (e.weight?'<div class="pe-val">⚖️ <span>'+e.weight+'</span>кг</div>':'')+
    (e.waist?'<div class="pe-val">📏 <span>'+e.waist+'</span>см</div>':'')+
    (e.hips?'<div class="pe-val">🍑 <span>'+e.hips+'</span>см</div>':'')+
    '</div></div><div class="pe-del" onclick="delE('+i+')">🗑️</div></div>'+
    (e.photo?'<img class="pe-big" src="'+e.photo+'" onclick="openFsI('+i+')" title="Нажмите для просмотра"/>':'')+
    '</div>';
  }).join('')+'</div>':'<div class="empty"><div class="empty-ico">📏</div><p>Добавьте первый замер</p></div>');
}

function rChart(){
  const data=entries.filter(e=>e[cM]);
  if(data.length<2)return'<div class="cw"><div class="ct-tabs">'+['weight','waist','hips'].map(m=>'<button class="ct '+(cM===m?'on':'')+'" onclick="setCM(\''+m+'\')">'+{weight:'Вес',waist:'Талия',hips:'Бёдра'}[m]+'</button>').join('')+'</div><div style="font-size:12px;color:var(--tx3);font-weight:700">Нужно минимум 2 замера</div></div>';
  const vals=data.map(e=>parseFloat(e[cM]));
  const mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;
  const W=310,H=100,pd=28;
  const x=i=>pd+(i/(data.length-1))*(W-pd*2);
  const y=v=>H-pd-((v-mn)/(mx-mn||1))*(H-pd*1.5);
  const pts=vals.map((v,i)=>x(i)+','+y(v)).join(' ');
  return'<div class="cw"><div class="ct-tabs">'+['weight','waist','hips'].map(m=>'<button class="ct '+(cM===m?'on':'')+'" onclick="setCM(\''+m+'\')">'+{weight:'Вес',waist:'Талия',hips:'Бёдра'}[m]+'</button>').join('')+'</div><svg style="width:100%;overflow:visible" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient></defs>'+vals.map((v,i)=>'<line x1="'+x(i)+'" y1="'+y(v)+'" x2="'+x(i)+'" y2="'+(H-pd/2)+'" stroke="rgba(124,58,237,.1)" stroke-width="1"/>').join('')+'<polyline points="'+pts+'" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+vals.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="url(#lg)"/><text x="'+x(i)+'" y="'+(y(v)-7)+'" text-anchor="middle" font-size="8" font-weight="700" fill="var(--tx3)">'+v+'</text><text x="'+x(i)+'" y="'+(H-2)+'" text-anchor="middle" font-size="7" fill="var(--tx3)">'+data[i].date.slice(5)+'</text>').join('')+'</svg></div>';
}
function setCM(m){cM=m;rProg();}

// Fullscreen photo
function openFsI(idx){
  const e=entries[idx];
  if(!e||!e.photo)return;
  document.getElementById('fs-img').src=e.photo;
  document.getElementById('fs-ov').classList.add('on');
}
function closeFs(){document.getElementById('fs-ov').classList.remove('on');}

let tmpPh=null;
function onPP(e){
  const file=e.target.files[0];if(!file)return;
  const img=new Image(),fr=new FileReader();
  fr.onload=ev=>{img.onload=()=>{
    const c=document.createElement('canvas');const max=500;
    let w=img.naturalWidth,h=img.naturalHeight;
    if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
    c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    tmpPh=c.toDataURL('image/jpeg',.78);
    document.getElementById('pe-pa').innerHTML='<img src="'+tmpPh+'"/><input type="file" id="pe-pf" accept="image/*" onchange="onPP(event)" style="display:none"/>';
  };img.src=ev.target.result;};fr.readAsDataURL(file);
}
function addE(){
  const date=document.getElementById('pe-d').value||td();
  const weight=parseFloat(document.getElementById('pe-w').value)||null;
  const waist=parseFloat(document.getElementById('pe-wa').value)||null;
  const hips=parseFloat(document.getElementById('pe-hi').value)||null;
  if(!weight&&!waist&&!hips){showT('⚠️ Введите хотя бы один параметр');return;}
  const idx=entries.findIndex(e=>e.date===date);
  const entry={date,weight,waist,hips,photo:tmpPh||null};
  if(idx>=0)entries[idx]=entry;else entries.push(entry);
  entries.sort((a,b)=>a.date.localeCompare(b.date));
  sv('k52_en',entries);tmpPh=null;showT('✅ Замер сохранён!');rProg();
}
function delE(i){entries.splice(i,1);sv('k52_en',entries);rProg();}
function fmtD(d){return new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}

// ══════════════ CALCULATOR-CONSTRUCTOR (MEAL MODE) ══════════════
// meal split: breakfast 25%, lunch 35%, dinner 30%, snack 10%
const MEAL_SPLIT={breakfast:.25,lunch:.35,dinner:.30,snack:.10};
const MEAL_NAMES={breakfast:'🌅 Завтрак',lunch:'🍽️ Обед',dinner:'🌙 Ужин',snack:'🍎 Перекус'};
let selMeal=null; // which meal user is building
let selCat=null;  // which category inside meal

function getMealTargets(meal){
  const cals=getCals()||2000;
  const split=MEAL_SPLIT[meal]||.25;
  const mealCals=Math.round(cals*split);
  const prot=pro?Math.round(pro.w*1.8):Math.round(cals*.30/4);
  const fat=Math.round(cals*.25/9);
  const carb=Math.round((cals-prot*4-fat*9)/4);
  // Scale macros to meal proportion
  return{
    cals:mealCals,
    p:Math.round(prot*split),
    f:Math.round(fat*split),
    c:Math.round(carb*split),
  };
}

// Calories eaten in this meal today (from foodLog, tagged by meal)
function getMealEaten(meal){
  const items=foodLog.filter(x=>x.meal===meal);
  return items.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c}),{k:0,p:0,f:0,c:0});
}

function rCalc(){
  const el=document.getElementById('calc-b');
  const cals=getCals()||2000;

  // Full day totals
  const totDay={k:0,p:0,f:0,c:0};
  foodLog.forEach(x=>{totDay.k+=x.k;totDay.p+=x.p;totDay.f+=x.f;totDay.c+=x.c;});
  const pct=Math.min(100,Math.round(totDay.k/cals*100));
  const prot=pro?Math.round(pro.w*1.8):Math.round(cals*.30/4);
  const fat=Math.round(cals*.25/9);
  const carb=Math.round((cals-prot*4-fat*9)/4);

  // If no meal selected — show meal picker
  if(!selMeal){
    const meals=['breakfast','lunch','dinner','snack'];
    el.innerHTML=`<div class="ptitle">Счётчик-конструктор 🧮</div>
    <div style="text-align:center;margin-bottom:12px">
      <div class="dt-n">${Math.round(totDay.k)}</div>
      <div class="dt-l">из ${cals} ккал сегодня</div>
      <div class="dt-bar"><div class="dt-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11px;font-weight:700;color:var(--tx3)">осталось ${Math.max(0,cals-Math.round(totDay.k))} ккал</div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="fr3">
        <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--gr)">${Math.round(totDay.p)}/${prot}г</div><div style="font-size:9px;font-weight:700;color:var(--tx3)">Белки</div></div>
        <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--am)">${Math.round(totDay.f)}/${fat}г</div><div style="font-size:9px;font-weight:700;color:var(--tx3)">Жиры</div></div>
        <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--bl)">${Math.round(totDay.c)}/${carb}г</div><div style="font-size:9px;font-weight:700;color:var(--tx3)">Углеводы</div></div>
      </div>
    </div>
    <div class="card">
      <div class="lbl">Выберите приём пищи</div>
      ${meals.map(m=>{
        const tgt=getMealTargets(m);
        const eaten=getMealEaten(m);
        const remK=Math.max(0,tgt.cals-Math.round(eaten.k));
        const done=eaten.k>=tgt.cals*.9;
        return`<div class="food-option ${done?'ok':''}" onclick="hap();selMeal='${m}';selCat=null;rCalc()" style="margin-bottom:8px">
          <div class="fo-ico" style="font-size:28px;width:44px;height:44px">${MEAL_NAMES[m].split(' ')[0]}</div>
          <div class="fo-info">
            <div class="fo-name">${MEAL_NAMES[m].split(' ').slice(1).join(' ')}</div>
            <div class="fo-desc">Цель: ${tgt.cals} ккал · Б:${tgt.p}г Ж:${tgt.f}г У:${tgt.c}г</div>
            <div style="font-size:11px;font-weight:800;color:${done?'var(--gr)':'var(--pu)'};margin-top:3px">${done?'✅ Выполнено':'Осталось: '+remK+' ккал'}</div>
          </div>
          <div style="font-size:11px;font-weight:900;color:${done?'var(--gr)':'var(--tx3)'};white-space:nowrap">${Math.round(eaten.k)}/${tgt.cals}<br>ккал</div>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="lbl">Быстрый поиск продукта</div>
      <div class="sw"><span class="si-ico">🔍</span><input class="si" type="text" id="fs" placeholder="Название продукта..." oninput="srchFd()" autocomplete="off"/></div>
      <div class="fres" id="fres"></div>
      <div id="pb" style="display:none">
        <div style="font-size:13px;font-weight:800;color:var(--tx2);margin-bottom:8px" id="sfn"></div>
        <div style="font-size:11px;font-weight:700;color:var(--tx3);margin-bottom:8px">Приём пищи: <select id="meal-sel" style="font-family:'Nunito',sans-serif;font-weight:700;font-size:12px;padding:4px 8px;border-radius:8px;border:2px solid var(--bd2);background:var(--bg);color:var(--tx)"><option value="breakfast">Завтрак</option><option value="lunch">Обед</option><option value="dinner">Ужин</option><option value="snack">Перекус</option></select></div>
        <div class="pr-row"><input class="pi" type="number" id="pg" placeholder="100" inputmode="decimal" step="1" value="100" oninput="updPv()"/><span style="font-size:12px;font-weight:700;color:var(--tx2)" id="pu">г</span></div>
        <div id="pp" style="margin-bottom:10px;font-size:12px;font-weight:700;color:var(--tx3)"></div>
        <button class="btn btn-g" onclick="addFl()">Добавить ➕</button>
      </div>
    </div>
    ${renderFoodLog()}`;
    updPv();
    return;
  }

  // Meal selected — show macro categories
  const tgt=getMealTargets(selMeal);
  const eaten=getMealEaten(selMeal);
  const remP=Math.max(0,tgt.p-Math.round(eaten.p));
  const remF=Math.max(0,tgt.f-Math.round(eaten.f));
  const remC=Math.max(0,tgt.c-Math.round(eaten.c));
  const remK=Math.max(0,tgt.cals-Math.round(eaten.k));

  const cats=[
    {id:'protein',ico:'🥩',nm:'Белки',target:tgt.p,eaten:Math.round(eaten.p),rem:remP,unit:'г',col:'var(--gr)'},
    {id:'fat',ico:'🥑',nm:'Жиры',target:tgt.f,eaten:Math.round(eaten.f),rem:remF,unit:'г',col:'var(--am)'},
    {id:'carb',ico:'🍚',nm:'Углеводы',target:tgt.c,eaten:Math.round(eaten.c),rem:remC,unit:'г',col:'var(--bl)'},
    {id:'other',ico:'💧',nm:'Напитки',target:0,eaten:0,rem:0,unit:'',col:'var(--cy)'},
  ];

  if(!selCat){
    // Show category picker for this meal
    el.innerHTML=`<div class="ptitle">${MEAL_NAMES[selMeal]}</div>
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-size:15px;font-weight:900">Цель на приём: ${tgt.cals} ккал</div>
          <div style="font-size:12px;font-weight:700;color:var(--tx3)">Съедено: ${Math.round(eaten.k)} ккал · Осталось: ${remK} ккал</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="hap();selMeal=null;rCalc()">← Назад</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px">
        ${cats.slice(0,3).map(c=>{
          const pct2=c.target>0?Math.min(100,Math.round(c.eaten/c.target*100)):0;
          return`<div style="text-align:center;background:var(--bg);border-radius:10px;padding:10px 4px">
            <div style="font-size:18px;font-weight:900;color:${c.col}">${c.eaten}/${c.target}${c.unit}</div>
            <div style="font-size:9px;font-weight:700;color:var(--tx3);margin-top:2px">${c.nm}</div>
            <div style="height:5px;border-radius:99px;background:var(--bd2);overflow:hidden;margin-top:5px">
              <div style="height:100%;border-radius:99px;background:${c.col};width:${pct2}%;transition:width .4s"></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="card">
      <div class="lbl">Выберите категорию продуктов</div>
      ${cats.map(c=>`<div class="food-option ${c.rem===0&&c.id!=='other'?'ok':''}" onclick="hap();selCat='${c.id}';rCalc()" style="margin-bottom:8px">
        <div class="fo-ico" style="font-size:28px;width:44px;height:44px;font-size:24px">${c.ico}</div>
        <div class="fo-info">
          <div class="fo-name">${c.nm}</div>
          ${c.target>0?`<div class="fo-desc">Цель: ${c.target}${c.unit} · Съедено: ${c.eaten}${c.unit}</div>
          <div style="font-size:11px;font-weight:800;color:${c.rem===0?'var(--gr)':'var(--pu)'};margin-top:3px">${c.rem===0?'✅ Выполнено':'Осталось: '+c.rem+c.unit+' (≈'+(c.rem*(c.id==='protein'?4:c.id==='fat'?9:4))+' ккал)'}</div>`:
          '<div class="fo-desc">Вода, чай, кофе и другое</div>'}
        </div>
        <div style="font-size:20px">›</div>
      </div>`).join('')}
    </div>
    ${renderFoodLog(selMeal)}`;
    return;
  }

  // Category selected — show food list
  const cat=cats.find(c=>c.id===selCat);
  const foods=FOODS.filter(f=>f.cat===selCat);
  const remKcal=remK;

  el.innerHTML=`<div class="ptitle">${cat.ico} ${cat.nm} — ${MEAL_NAMES[selMeal].split(' ').slice(1).join(' ')}</div>
  <div class="card" style="margin-bottom:11px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:14px;font-weight:900">Нужно: <span style="color:${cat.col}">${cat.rem}${cat.unit}</span> ${cat.nm.toLowerCase()}</div>
        <div style="font-size:12px;font-weight:700;color:var(--tx3)">≈ ${Math.round(cat.rem*(selCat==='protein'?4:selCat==='fat'?9:4))} ккал · Осталось на приём: ${remK} ккал</div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="hap();selCat=null;rCalc()">← Назад</button>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--tx3);margin-top:8px;padding:8px;background:var(--bg);border-radius:8px">
      ✅ — вписывается в норму &nbsp; ⚠️ — немного &nbsp; ❌ — превышает норму
    </div>
  </div>
  <div class="card">
  ${foods.map(fd=>{
    // How many grams to meet the macro target for this category
    const macroKey=selCat==='protein'?'p':selCat==='fat'?'f':selCat==='carb'?'c':null;
    let recGrams=200;
    if(macroKey&&fd[macroKey]>0){
      recGrams=Math.round(cat.rem/fd[macroKey]*100);
    }
    recGrams=Math.max(10,Math.min(recGrams,600));
    // Check if it fits by kcal too
    const kcalUsed=Math.round(fd.k*recGrams/100);
    const status=kcalUsed<=remKcal*1.1?'ok':kcalUsed<=remKcal*1.5?'warn':'no';
    const badge=status==='ok'?'✅ Ок':status==='warn'?'⚠️ Много':'❌ Превышает';
    const descMacro=macroKey?`${recGrams}г → ${cat.nm}: ${(fd[macroKey]*recGrams/100).toFixed(0)}${cat.unit}`:`${recGrams}г`;
    return`<div class="food-option ${status}" onclick="hap();quickAddFood('${fd.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',${recGrams},'${selMeal}')" style="margin-bottom:8px">
      <div class="fo-ico">${fd.e}</div>
      <div class="fo-info">
        <div class="fo-name">${fd.n}</div>
        <div class="fo-desc">${fd.k} ккал/100г · рекомендую: ${descMacro}</div>
        <div style="font-size:11px;font-weight:700;color:var(--tx3);margin-top:2px">${kcalUsed} ккал за ${recGrams}г</div>
      </div>
      <div class="fo-badge ${status}">${badge}</div>
    </div>`;
  }).join('')}
  </div>
  ${renderFoodLog(selMeal)}`;
}

function renderFoodLog(meal){
  const items=meal?foodLog.filter(x=>x.meal===meal):foodLog;
  if(items.length===0)return'<div class="empty"><div class="empty-ico">🍽️</div><p>'+(meal?'В этот приём пока ничего нет':'Начните добавлять продукты')+'</p></div>';
  return'<div style="margin-top:4px">'+
  items.map((f,i)=>{
    const realIdx=foodLog.indexOf(f);
    return'<div class="fl-item"><div class="fl-ico">'+f.e+'</div><div class="fl-info"><div class="fl-nm">'+f.n+'</div><div class="fl-dt">'+f.portion+' '+f.u+(f.meal?' · '+MEAL_NAMES[f.meal].split(' ').slice(1).join(' '):'')+'</div><div class="fl-macs"><span class="fm fm-p">Б:'+f.p.toFixed(1)+'г</span><span class="fm fm-f">Ж:'+f.f.toFixed(1)+'г</span><span class="fm fm-c">У:'+f.c.toFixed(1)+'г</span></div></div><div class="fl-k">'+f.k+' ккал</div><div class="fl-del" onclick="hap();rmFl('+realIdx+')">✕</div></div>';
  }).join('')+
  '<button class="btn btn-ghost mt" onclick="hap();clrFl()">Очистить 🗑️</button></div>';
}

function quickAddFood(name,grams,meal){
  const fd=FOODS.find(f=>f.n===name);if(!fd)return;
  const g=Math.max(1,Math.min(grams,600));const r=g/100;
  const m=meal||selMeal||'breakfast';
  foodLog.push({n:fd.n,e:fd.e,u:fd.u,portion:g,meal:m,k:Math.round(fd.k*r),p:parseFloat((fd.p*r).toFixed(1)),f:parseFloat((fd.f*r).toFixed(1)),c:parseFloat((fd.c*r).toFixed(1))});
  sv('k52_fl_'+td(),foodLog);
  showT('✅ '+fd.n+' ('+g+'г) добавлено');
  selCat=null;rCalc();
}

function srchFd(){
  const q=document.getElementById('fs').value.toLowerCase().trim();
  const res=document.getElementById('fres');
  if(q.length<2){res.classList.remove('on');return;}
  const found=FOODS.filter(f=>f.n.toLowerCase().includes(q)).slice(0,7);
  if(!found.length){res.innerHTML='<div class="fri"><span class="fri-n">Ничего не найдено</span></div>';res.classList.add('on');return;}
  res.innerHTML=found.map(f=>'<div class="fri" onclick="hap();selFd2(\''+f.n.replace(/\\/g,'\\\\').replace(/'/g,"\\'")+'\')"><div class="fri-n">'+f.e+' '+f.n+'<small>Б:'+f.p+' Ж:'+f.f+' У:'+f.c+' на 100'+f.u+'</small></div><div class="fri-k">'+f.k+'кк</div></div>').join('');
  res.classList.add('on');
}
function selFd2(name){
  selFd=FOODS.find(f=>f.n===name);if(!selFd)return;
  document.getElementById('fres').classList.remove('on');document.getElementById('fs').value='';
  document.getElementById('sfn').textContent=selFd.e+' '+selFd.n;
  document.getElementById('pu').textContent=selFd.u;
  document.getElementById('pb').style.display='block';
  document.getElementById('pg').value='100';updPv();
}
function updPv(){
  if(!selFd)return;
  const g=parseFloat(document.getElementById('pg').value)||0,r=g/100;
  document.getElementById('pp').innerHTML='<span style="color:var(--pu);font-weight:900">'+Math.round(selFd.k*r)+' ккал</span> · Б:'+(selFd.p*r).toFixed(1)+'г · Ж:'+(selFd.f*r).toFixed(1)+'г · У:'+(selFd.c*r).toFixed(1)+'г';
}
function addFl(){
  if(!selFd)return;
  const g=parseFloat(document.getElementById('pg').value)||100,r=g/100;
  const mealEl=document.getElementById('meal-sel');
  const m=mealEl?mealEl.value:(selMeal||'breakfast');
  foodLog.push({n:selFd.n,e:selFd.e,u:selFd.u,portion:g,meal:m,k:Math.round(selFd.k*r),p:parseFloat((selFd.p*r).toFixed(1)),f:parseFloat((selFd.f*r).toFixed(1)),c:parseFloat((selFd.c*r).toFixed(1))});
  sv('k52_fl_'+td(),foodLog);selFd=null;document.getElementById('pb').style.display='none';rCalc();
}
function rmFl(i){foodLog.splice(i,1);sv('k52_fl_'+td(),foodLog);rCalc();}
function clrFl(){foodLog=[];sv('k52_fl_'+td(),foodLog);selMeal=null;selCat=null;rCalc();}

// ══════════════ MODAL / TOAST ══════════════
function closeMo(e){if(!e||e.target===document.getElementById('mo'))document.getElementById('mo').classList.remove('on');}
function showT(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500);}

// ══════ HAPTICS ══════
function hap(type){
  try{
    if(navigator.vibrate){
      if(type==='light')navigator.vibrate(8);
      else if(type==='success')navigator.vibrate([10,30,10]);
      else navigator.vibrate(12);
    }
  }catch(e){}
}
// Inject haptics on all .btn, .chip, .gc, .ni, .food-option clicks
document.addEventListener('click',function(e){
  const el=e.target.closest('.btn,.chip,.gc,.ni,.food-option,.fl-del,.ci-chk,.pe-del,.ir-edit,.fri');
  if(el)hap('light');
},true);
document.addEventListener('click',function(e){
  const el=e.target.closest('.btn-p,.btn-g,.btn-o,.btn-r');
  if(el)hap('success');
},true);
