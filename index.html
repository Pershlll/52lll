<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Калории 52"/>
<title>Калории 52</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --purple:#7C3AED;--purple2:#9D5CF6;--purplel:rgba(124,58,237,0.12);
  --green:#10B981;--greenl:rgba(16,185,129,0.12);
  --amber:#F59E0B;--amberl:rgba(245,158,11,0.12);
  --red:#EF4444;--redl:rgba(239,68,68,0.12);
  --blue:#3B82F6;--bluel:rgba(59,130,246,0.12);
  --pink:#EC4899;
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --bg:#F3F4F6;--surface:#FFFFFF;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --r:16px;--r-sm:10px;
  --shadow:0 2px 12px rgba(0,0,0,0.07);--shadow-lg:0 8px 32px rgba(0,0,0,0.14);
}
@media(prefers-color-scheme:dark){:root{
  --text:#F9FAFB;--text2:#9CA3AF;--text3:#6B7280;
  --bg:#0F0F14;--surface:#1C1C28;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --shadow:0 2px 12px rgba(0,0,0,0.4);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Nunito',sans-serif;color:var(--text);background:var(--bg);overflow:hidden}

/* APP SHELL */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto}

/* HEADER */
.hdr{padding:50px 18px 14px;background:var(--surface);border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.hdr-logo{font-size:22px;font-weight:900;letter-spacing:-0.5px}
.hdr-logo span{background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-sub{font-size:12px;font-weight:700;color:var(--text3);margin-top:2px}
.avatar-btn{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--purple);background:var(--purplel);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;flex-shrink:0}
.avatar-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-edit{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;background:var(--purple);border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff}

/* NAV */
.nav{display:flex;background:var(--surface);border-top:0.5px solid var(--border);padding:6px 0 max(18px,env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,0.05)}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;cursor:pointer;border:none;background:none;color:var(--text3);font-size:9px;font-family:'Nunito',sans-serif;font-weight:800;transition:color .15s}
.ni.on{color:var(--purple)}
.ni-ico{font-size:20px;line-height:1;transition:transform .2s}
.ni.on .ni-ico{transform:scale(1.15)}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 6px}
.page{display:none}.page.on{display:block}

/* CARDS */
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}

/* FIELDS */
.fld{margin-bottom:12px}.fld:last-child{margin-bottom:0}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 14px;font-size:15px;font-family:'Nunito',sans-serif;font-weight:600;border:2px solid var(--border2);border-radius:var(--r-sm);background:var(--bg);color:var(--text);-webkit-appearance:none;transition:border-color .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--purple)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* SEGMENT */
.seg{display:flex;background:var(--bg);border-radius:var(--r-sm);padding:3px;gap:2px}
.sb{flex:1;padding:9px 4px;text-align:center;font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;border-radius:8px;cursor:pointer;color:var(--text3);border:none;background:none;transition:all .15s}
.sb.on{background:var(--surface);color:var(--purple);box-shadow:0 2px 6px rgba(0,0,0,0.1)}

/* BUTTONS */
.btn{width:100%;padding:14px;font-size:15px;font-weight:900;font-family:'Nunito',sans-serif;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s;letter-spacing:.2px}
.btn:active{transform:scale(0.98)}
.btn-p{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 4px 14px rgba(124,58,237,0.35)}
.btn-g{background:linear-gradient(135deg,var(--green),#059669);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,0.3)}
.btn-o{background:linear-gradient(135deg,var(--amber),#D97706);color:#fff;box-shadow:0 4px 14px rgba(245,158,11,0.3)}
.btn-r{background:linear-gradient(135deg,var(--red),#DC2626);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,0.3)}
.btn-sm{padding:9px 16px;font-size:13px;width:auto;border-radius:99px}
.btn-ghost{background:var(--bg);color:var(--text2);border:2px solid var(--border2)}
.mt8{margin-top:8px}.mt12{margin-top:12px}

/* STAT GRID */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{border-radius:var(--r);padding:14px;color:#fff;position:relative;overflow:hidden}
.sc::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(255,255,255,0.12);border-radius:50%}
.sc-lb{font-size:11px;font-weight:700;opacity:.8;margin-bottom:4px}
.sc-v{font-size:24px;font-weight:900;line-height:1}
.sc-u{font-size:11px;font-weight:600;opacity:.7;margin-left:2px}
.sc1{background:linear-gradient(135deg,#7C3AED,#9D5CF6)}
.sc2{background:linear-gradient(135deg,#10B981,#059669)}
.sc3{background:linear-gradient(135deg,#F59E0B,#D97706)}
.sc4{background:linear-gradient(135deg,#3B82F6,#2563EB)}

/* GOAL CARDS */
.gcards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.gc{border-radius:var(--r-sm);padding:12px 6px;text-align:center;cursor:pointer;border:2px solid var(--border);background:var(--surface);transition:all .15s}
.gc.on{border-color:var(--purple);background:var(--purplel)}
.gc-t{font-size:10px;font-weight:800;color:var(--text3);margin-bottom:3px}
.gc.on .gc-t{color:var(--purple)}
.gc-n{font-size:19px;font-weight:900;color:var(--text)}
.gc.on .gc-n{color:var(--purple)}
.gc-s{font-size:9px;color:var(--text3);font-weight:700;margin-top:2px}

/* MACROS */
.mac{margin-bottom:12px}
.mac-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mac-n{font-size:13px;font-weight:700;color:var(--text2)}
.mac-v{font-size:13px;font-weight:900}
.bar{height:7px;border-radius:99px;background:var(--bg);overflow:hidden}
.bfill{height:100%;border-radius:99px;transition:width .5s ease}

/* RECIPE CARDS */
.rgrid{display:grid;gap:10px}
.rc{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.rc:active{transform:scale(0.98)}
.rc-img{width:100%;height:150px;object-fit:cover;background:var(--bg)}
.rc-ph{width:100%;height:150px;display:flex;align-items:center;justify-content:center;font-size:56px;background:var(--bg)}
.rc-body{padding:12px}
.rc-name{font-size:15px;font-weight:800;margin-bottom:6px}
.rc-row{display:flex;align-items:center;justify-content:space-between}
.rc-tags{display:flex;gap:4px;flex-wrap:wrap}
.rc-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--text3)}
.rc-kcal{font-size:14px;font-weight:900;color:#fff;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,#EF4444,#F59E0B)}
.rc-macs{display:flex;gap:8px;margin-top:8px}
.rc-mac{flex:1;text-align:center;background:var(--bg);border-radius:8px;padding:6px 2px}
.rc-mv{font-size:13px;font-weight:900}
.rc-mn{font-size:9px;font-weight:700;color:var(--text3)}

/* FIT BADGE */
.fit{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:99px;margin-bottom:6px}
.fit-ok{background:var(--greenl);color:var(--green)}
.fit-good{background:var(--amberl);color:var(--amber)}
.fit-high{background:var(--redl);color:var(--red)}

/* FILTERS */
.filt{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:99px;font-size:12px;font-weight:800;font-family:'Nunito',sans-serif;white-space:nowrap;cursor:pointer;border:2px solid var(--border2);color:var(--text2);background:var(--surface);transition:all .15s;flex-shrink:0}
.chip.on{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 3px 10px rgba(124,58,237,0.3)}

/* PROGRESS */
.prog-hero{background:linear-gradient(135deg,var(--purple),var(--pink));border-radius:var(--r);padding:18px;margin-bottom:12px;color:#fff}
.prog-title{font-size:18px;font-weight:900;margin-bottom:4px}
.prog-sub{font-size:13px;font-weight:600;opacity:.8}
.prog-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.ps{background:rgba(255,255,255,.15);border-radius:10px;padding:10px 6px;text-align:center}
.ps-v{font-size:20px;font-weight:900}
.ps-l{font-size:10px;font-weight:700;opacity:.8;margin-top:2px}
.ps-d{font-size:10px;font-weight:700;margin-top:2px}
.ps-d.up{color:#FFD700}.ps-d.dn{color:#90EE90}.ps-d.eq{opacity:.6}

/* CHART */
.chart-wrap{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.chart-tabs{display:flex;gap:6px;margin-bottom:12px}
.ct{padding:5px 12px;border-radius:99px;font-size:11px;font-weight:800;cursor:pointer;border:2px solid var(--border2);color:var(--text3);background:none;font-family:'Nunito',sans-serif;transition:all .15s}
.ct.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.chart-svg{width:100%;overflow:visible}

/* PROGRESS ENTRIES */
.pe{background:var(--surface);border-radius:var(--r);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.pe-head{display:flex;align-items:center;gap:12px;padding:14px}
.pe-photo{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--bg);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;overflow:hidden}
.pe-photo img{width:100%;height:100%;object-fit:cover}
.pe-info{flex:1}
.pe-date{font-size:13px;font-weight:800;color:var(--text);margin-bottom:4px}
.pe-vals{display:flex;gap:10px}
.pe-val{font-size:12px;font-weight:700;color:var(--text2)}
.pe-val span{color:var(--purple);font-weight:900}
.pe-del{font-size:18px;color:var(--text3);cursor:pointer;padding:4px}
.pe-imgbig{width:100%;max-height:200px;object-fit:cover;display:block}

/* ADD ENTRY FORM */
.add-form{background:var(--surface);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:2px dashed var(--border2)}
.photo-upload-area{width:100%;height:90px;border-radius:var(--r-sm);border:2px dashed var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:var(--bg);font-size:12px;font-weight:700;color:var(--text3);overflow:hidden;transition:border-color .15s;position:relative}
.photo-upload-area:hover{border-color:var(--purple)}
.photo-upload-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px}
.photo-upload-area input{display:none}

/* CALCULATOR */
.calc-hero{background:linear-gradient(135deg,#F59E0B,#EF4444);border-radius:var(--r);padding:18px;margin-bottom:12px;color:#fff}
.daily-total{text-align:center;margin-bottom:16px}
.dt-num{font-size:52px;font-weight:900;line-height:1;background:linear-gradient(135deg,var(--purple),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dt-lbl{font-size:13px;font-weight:700;color:var(--text3);margin-top:2px}
.dt-bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:10px 0}
.dt-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--purple));transition:width .4s}

.search-wrap{position:relative;margin-bottom:10px}
.search-input{width:100%;padding:13px 14px 13px 42px;font-size:15px;font-family:'Nunito',sans-serif;font-weight:700;border:2px solid var(--border2);border-radius:var(--r-sm);background:var(--bg);color:var(--text);-webkit-appearance:none;transition:border-color .15s}
.search-input:focus{outline:none;border-color:var(--purple)}
.search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}

.food-results{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);margin-bottom:10px;overflow:hidden;display:none}
.food-results.show{display:block}
.fri{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--border);cursor:pointer;transition:background .15s}
.fri:last-child{border-bottom:none}
.fri:active{background:var(--bg)}
.fri-name{font-size:14px;font-weight:700;color:var(--text)}
.fri-kcal{font-size:13px;font-weight:900;color:var(--purple)}

.portion-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.portion-input{flex:1;padding:11px 12px;font-size:15px;font-family:'Nunito',sans-serif;font-weight:700;border:2px solid var(--border2);border-radius:var(--r-sm);background:var(--bg);color:var(--text);-webkit-appearance:none}
.portion-input:focus{outline:none;border-color:var(--purple)}
.portion-unit{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}

.food-log{margin-top:4px}
.fl-item{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.fl-icon{font-size:22px;width:38px;height:38px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fl-info{flex:1}
.fl-name{font-size:13px;font-weight:800;color:var(--text);margin-bottom:2px}
.fl-detail{font-size:11px;font-weight:700;color:var(--text3)}
.fl-kcal{font-size:15px;font-weight:900;color:var(--purple);white-space:nowrap}
.fl-del{font-size:16px;color:var(--text3);cursor:pointer;padding:4px;flex-shrink:0}
.fl-macs{display:flex;gap:6px;margin-top:6px}
.fl-mac{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
.fl-mac-p{background:var(--greenl);color:var(--green)}
.fl-mac-f{background:var(--amberl);color:var(--amber)}
.fl-mac-c{background:var(--bluel);color:var(--blue)}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
.modal-ov.on{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.2,.64,1)}
.modal-ov.on .modal{transform:translateY(0)}
.modal-bar{width:36px;height:4px;background:var(--border2);border-radius:99px;margin:12px auto 0}
.modal-img{width:100%;height:210px;object-fit:cover}
.modal-ph{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:72px;background:var(--bg)}
.modal-body{padding:16px 18px 40px}
.modal-title{font-size:20px;font-weight:900;margin-bottom:6px}
.modal-kcal{font-size:34px;font-weight:900;background:linear-gradient(135deg,#EF4444,#F59E0B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.mpills{display:flex;gap:8px;margin-bottom:16px}
.mp{flex:1;border-radius:10px;padding:10px 4px;text-align:center}
.mp-p{background:linear-gradient(135deg,#10B981,#059669)}
.mp-f{background:linear-gradient(135deg,#F59E0B,#D97706)}
.mp-c{background:linear-gradient(135deg,#3B82F6,#2563EB)}
.mp-v{font-size:18px;font-weight:900;color:#fff}
.mp-n{font-size:10px;font-weight:700;color:rgba(255,255,255,.8)}
.sec-t{font-size:14px;font-weight:800;color:var(--text2);margin:14px 0 8px}
.ingr{font-size:13px;font-weight:600;padding:8px 0;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:8px}
.ingr::before{content:'•';color:var(--purple);font-weight:900;font-size:16px}
.step{display:flex;gap:10px;margin-bottom:10px}
.sn{min-width:26px;height:26px;background:var(--purple);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;margin-top:1px}
.st{font-size:13px;font-weight:600;color:var(--text);line-height:1.5}

/* WELCOME */
.welcome{background:linear-gradient(135deg,var(--purple),var(--pink));border-radius:var(--r);padding:18px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden}
.welcome::after{content:'🥗';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:48px;opacity:.25}
.w-name{font-size:21px;font-weight:900;margin-bottom:3px}
.w-sub{font-size:13px;font-weight:600;opacity:.8}

.ptitle{font-size:22px;font-weight:900;margin-bottom:14px;letter-spacing:-.3px}
.empty{text-align:center;padding:40px 20px}
.empty-ico{font-size:52px;margin-bottom:12px}
.empty p{font-size:14px;font-weight:600;color:var(--text3);line-height:1.6}
.empty a{color:var(--purple);cursor:pointer;text-decoration:none}

/* TOAST */
.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;font-family:'Nunito',sans-serif;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.toast.on{opacity:1}

input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=date]{color-scheme:light dark}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="hdr">
    <div>
      <div class="hdr-logo">Калории <span>52</span></div>
      <div class="hdr-sub" id="hdr-sub">Ваш личный нутрициолог</div>
    </div>
    <div class="avatar-btn" id="avatar-btn" onclick="triggerAvatarUpload()">
      <span id="avatar-ico">👤</span>
      <img id="avatar-img" style="display:none" src="" alt=""/>
      <div class="avatar-edit">✏️</div>
      <input type="file" id="avatar-file" accept="image/*" style="display:none" onchange="onAvatarChange(event)"/>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="scroll" id="scroll">
    <!-- PROFILE -->
    <div id="pg-profile" class="page on">
      <div class="card">
        <div class="lbl">Личные данные</div>
        <div class="frow">
          <div class="fld"><label>Имя</label><input type="text" id="f-name" placeholder="Ваше имя"/></div>
          <div class="fld"><label>Возраст</label><input type="number" id="f-age" placeholder="30" inputmode="numeric"/></div>
        </div>
        <div class="fld"><label>Пол</label>
          <div class="seg">
            <button class="sb on" id="g-male" onclick="setG('male')">Мужской</button>
            <button class="sb" id="g-female" onclick="setG('female')">Женский</button>
          </div>
        </div>
        <div class="fld"><label>Рост (см)</label><input type="number" id="f-height" placeholder="170" inputmode="numeric"/></div>
      </div>
      <div class="card">
        <div class="lbl">Размеры тела</div>
        <div class="frow">

(function(){
  try{
    const p=localStorage.getItem('k52_p'); if(p){profile=JSON.parse(p);gender=profile.gender;goal=profile.userGoal;fillForm();updateHeader();}
    const e=localStorage.getItem('k52_entries'); if(e) progEntries=JSON.parse(e);
    const fl=localStorage.getItem('k52_foodlog_'+today()); if(fl) foodLog=JSON.parse(fl);
    const av=localStorage.getItem('k52_avatar'); if(av) setAvatarImg(av);
  }catch(e){}
  setG(gender,true); setGoal(goal,true);
})();

function today(){return new Date().toISOString().slice(0,10)}

function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){showToast('⚠️ Мало памяти — очистите старые записи');}}

function fillForm(){
  if(!profile) return;
  document.getElementById('f-name').value=profile.name||'';
  document.getElementById('f-age').value=profile.a||'';
  document.getElementById('f-height').value=profile.h||'';
  document.getElementById('f-weight').value=profile.w||'';
  document.getElementById('f-waist').value=profile.waist||'';
  document.getElementById('f-hips').value=profile.hips||'';
  document.getElementById('f-act').value=profile.act||1.55;
}

function updateHeader(){
  if(!profile) return;
  document.getElementById('hdr-sub').textContent=profile.name?`Привет, ${profile.name}! 👋`:'Ваш личный нутрициолог';
  if(!localStorage.getItem('k52_avatar'))
    document.getElementById('avatar-ico').textContent=gender==='female'?'👩':'👨';
}

function onAvatarChange(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{save('k52_avatar',ev.target.result);setAvatarImg(ev.target.result);showToast('✅ Фото профиля обновлено');};
  r.readAsDataURL(file);
}
function setAvatarImg(src){
  document.getElementById('avatar-ico').style.display='none';
  const img=document.getElementById('avatar-img');
  img.src=src; img.style.display='block';
}

// PROFILE
// ═══════════════════════════════════════════════════════════
function setG(g,silent){
  gender=g;
  document.getElementById('g-male').classList.toggle('on',g==='male');
  document.getElementById('g-female').classList.toggle('on',g==='female');
}
function setGoal(g,silent){
  goal=g;
  ['lose','maintain','gain'].forEach(x=>document.getElementById('goal-'+x).classList.toggle('on',x===g));
}

function bmr(w,h,a,g){return g==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161}

function saveProfile(){
  const w=parseFloat(document.getElementById('f-weight').value);
  const h=parseFloat(document.getElementById('f-height').value);
  const a=parseFloat(document.getElementById('f-age').value);
  if(!w||!h||!a){showToast('⚠️ Введите вес, рост и возраст');return;}
  const waist=parseFloat(document.getElementById('f-waist').value)||0;
  const hips=parseFloat(document.getElementById('f-hips').value)||0;
  const act=parseFloat(document.getElementById('f-act').value);
  const name=document.getElementById('f-name').value||'Пользователь';
  const tdee=Math.round(bmr(w,h,a,gender)*act);
  profile={name,w,h,a,waist,hips,gender,act,userGoal:goal,tdee,bmrV:Math.round(bmr(w,h,a,gender)),bmi:w/((h/100)**2),loseCals:tdee-500,gainCals:tdee+300};
  save('k52_p',profile);
  updateHeader();
  showToast('✅ Профиль сохранён!');
  setTimeout(()=>go('dash'),700);
}

// NAVIGATION
// ═══════════════════════════════════════════════════════════
const PAGES=['profile','dash','rec','prog','calc'];
function go(p){
  PAGES.forEach(x=>{
    document.getElementById('pg-'+x).classList.toggle('on',x===p);
    document.getElementById('n-'+x).classList.toggle('on',x===p);
  });
  document.getElementById('scroll').scrollTop=0;
  if(p==='dash') renderDash();
  if(p==='rec') renderRec();
  if(p==='prog') renderProg();
  if(p==='calc') renderCalc();
}

// DASHBOARD

function getCals(){
  if(!profile) return null;
  return goal==='lose'?profile.loseCals:goal==='gain'?profile.gainCals:profile.tdee;
}

function renderDash(){
  const el=document.getElementById('dash-body');
  if(!profile){el.innerHTML=`<div class="empty"><div class="empty-ico">📊</div><p>Заполните <a onclick="go('profile')">профиль</a>, чтобы увидеть ваш план.</p></div>`;return;}
  const {name,w,bmi,tdee,bmrV,loseCals,gainCals,userGoal:uG}=profile;
  const cals=getCals();
  const prot=Math.round(w*1.8),fat=Math.round(cals*.25/9),carb=Math.round((cals-prot*4-fat*9)/4);
  const bmiLbl=bmi<18.5?'Недовес':bmi<25?'Норма ✅':bmi<30?'Избыток':'Ожирение';
  const pPct=Math.min(100,Math.round(prot*4*100/cals)),fPct=Math.min(100,Math.round(fat*9*100/cals)),cPct=Math.min(100,Math.round(carb*4*100/cals));
  el.innerHTML=`
  <div class="welcome"><div class="w-name">Привет, ${name}! 👋</div><div class="w-sub">Ваш план питания на сегодня</div></div>
  <div class="sgrid">
    <div class="sc sc1"><div class="sc-lb">ИМТ</div><div class="sc-v">${bmi.toFixed(1)}<span class="sc-u">${bmiLbl}</span></div></div>
    <div class="sc sc2"><div class="sc-lb">Базовый обмен</div><div class="sc-v">${bmrV}<span class="sc-u">ккал</span></div></div>
    <div class="sc sc3"><div class="sc-lb">TDEE</div><div class="sc-v">${tdee}<span class="sc-u">ккал</span></div></div>
    <div class="sc sc4"><div class="sc-lb">Вес</div><div class="sc-v">${w}<span class="sc-u">кг</span></div></div>
  </div>
  <div class="card">
    <div class="lbl">Выберите цель</div>
    <div class="gcards">
      <div class="gc ${uG==='lose'?'on':''}" onclick="selGoal('lose')"><div class="gc-t">🔻 Похудение</div><div class="gc-n">${loseCals}</div><div class="gc-s">ккал/день</div></div>
      <div class="gc ${uG==='maintain'?'on':''}" onclick="selGoal('maintain')"><div class="gc-t">⚖️ Поддержание</div><div class="gc-n">${tdee}</div><div class="gc-s">ккал/день</div></div>
      <div class="gc ${uG==='gain'?'on':''}" onclick="selGoal('gain')"><div class="gc-t">💪 Набор</div><div class="gc-n">${gainCals}</div><div class="gc-s">ккал/день</div></div>
    </div>
  </div>
  <div class="card">
    <div class="lbl">Макросы — ${cals} ккал/день</div>
    <div class="mac"><div class="mac-h"><span class="mac-n">🥩 Белки</span><span class="mac-v" style="color:var(--green)">${prot} г</span></div><div class="bar"><div class="bfill" style="width:${pPct}%;background:linear-gradient(90deg,var(--green),#059669)"></div></div></div>
    <div class="mac"><div class="mac-h"><span class="mac-n">🥑 Жиры</span><span class="mac-v" style="color:var(--amber)">${fat} г</span></div><div class="bar"><div class="bfill" style="width:${fPct}%;background:linear-gradient(90deg,var(--amber),#D97706)"></div></div></div>
    <div class="mac"><div class="mac-h"><span class="mac-n">🍚 Углеводы</span><span class="mac-v" style="color:var(--blue)">${carb} г</span></div><div class="bar"><div class="bfill" style="width:${cPct}%;background:linear-gradient(90deg,var(--blue),#2563EB)"></div></div></div>
  </div>
  <button class="btn btn-g mt8" onclick="go('rec')">Посмотреть рецепты 🍽️</button>
  <button class="btn btn-p mt8" onclick="go('calc')">Счётчик калорий 🧮</button>`;
}

function selGoal(g){
  if(!profile) return;
  profile.userGoal=g; goal=g;
  save('k52_p',profile);
  renderDash();
}

function scaleR(r,cals){
  const mt=cals*r.basePct, ratio=Math.min(1.5,Math.max(0.7,mt/r.kcal));
  return{...r,kcalS:Math.round(r.kcal*ratio),pS:Math.round(r.p*ratio),fS:Math.round(r.f*ratio),cS:Math.round(r.c*ratio),diff:Math.abs(r.kcal*ratio-mt)};
}
function fitLbl(d){return d<30?{c:'fit-ok',t:'✅ Идеально'}:d<80?{c:'fit-good',t:'👍 Подходит'}:{c:'fit-high',t:'⚠️ Скорректировать'};}

function renderRec(){
  const el=document.getElementById('rec-body');
  const cals=getCals();
  const filters=[{id:'all',l:'Все'},{id:'breakfast',l:'Завтрак'},{id:'lunch',l:'Обед'},{id:'dinner',l:'Ужин'},{id:'snack',l:'Перекус'}];
  let list=RECIPES.filter(r=>recFilter==='all'||r.meal===recFilter);
  let scaled=list.map(r=>cals?scaleR(r,cals):{...r,kcalS:r.kcal,pS:r.p,fS:r.f,cS:r.c,diff:999});
  scaled.sort((a,b)=>a.diff-b.diff);
  el.innerHTML=`
  <div class="ptitle">Рецепты 🍽️</div>
  ${cals?`<div style="font-size:12px;font-weight:700;color:var(--text3);margin-bottom:10px;">Порции рассчитаны под ваши <span style="color:var(--purple)">${cals} ккал/день</span></div>`:''}
  <div class="filt">${filters.map(f=>`<div class="chip ${recFilter===f.id?'on':''}" onclick="setRF('${f.id}')">${f.l}</div>`).join('')}</div>
  <div class="rgrid">${scaled.map(r=>{
    const fit=cals?fitLbl(r.diff):null;
    return`<div class="rc" onclick="openRec(${r.id})">
      <img class="rc-img" src="${r.img}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <div class="rc-ph" style="display:none">${r.emoji}</div>
      <div class="rc-body">
        ${fit?`<div class="fit ${fit.c}">${fit.t}</div>`:''}
        <div class="rc-name">${r.emoji} ${r.name}</div>
        <div class="rc-row">
          <div class="rc-tags">${r.tags.map(t=>`<span class="rc-tag">${t}</span>`).join('')}</div>
          <div class="rc-kcal">${r.kcalS} ккал</div>
        </div>
        <div class="rc-macs">
          <div class="rc-mac"><div class="rc-mv" style="color:var(--green)">${r.pS}г</div><div class="rc-mn">Белки</div></div>
          <div class="rc-mac"><div class="rc-mv" style="color:var(--amber)">${r.fS}г</div><div class="rc-mn">Жиры</div></div>
          <div class="rc-mac"><div class="rc-mv" style="color:var(--blue)">${r.cS}г</div><div class="rc-mn">Углев.</div></div>
        </div>
      </div></div>`;}).join('')}</div>`;
}

function setRF(f){recFilter=f;renderRec();}

function openRec(id){
  const r0=RECIPES.find(x=>x.id===id), cals=getCals();
  const r=cals?scaleR(r0,cals):{...r0,kcalS:r0.kcal,pS:r0.p,fS:r0.f,cS:r0.c,diff:0};
  const fit=cals?fitLbl(r.diff):null;
  document.getElementById('modal-in').innerHTML=`
    <img class="modal-img" src="${r.img}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
    <div class="modal-ph" style="display:none">${r.emoji}</div>
    <div class="modal-body">
      ${fit?`<div class="fit ${fit.c}" style="margin-bottom:8px">${fit.t}</div>`:''}
      <div class="modal-title">${r.emoji} ${r.name}</div>
      <div class="modal-kcal">${r.kcalS} ккал</div>
      <div class="mpills">
        <div class="mp mp-p"><div class="mp-v">${r.pS}г</div><div class="mp-n">Белки</div></div>
        <div class="mp mp-f"><div class="mp-v">${r.fS}г</div><div class="mp-n">Жиры</div></div>
        <div class="mp mp-c"><div class="mp-v">${r.cS}г</div><div class="mp-n">Углев.</div></div>
      </div>
      <div class="sec-t">🛒 Ингредиенты</div>
      ${r.ingredients.map(i=>`<div class="ingr">${i}</div>`).join('')}
      <div class="sec-t">👨‍🍳 Приготовление</div>
      ${r.steps.map((s,i)=>`<div class="step"><div class="sn">${i+1}</div><div class="st">${s}</div></div>`).join('')}
    </div>`;
  document.getElementById('modal-ov').classList.add('on');
}

function renderProg(){
  const el=document.getElementById('prog-body');
  const latest=progEntries[progEntries.length-1];
  const prev=progEntries[progEntries.length-2];

  const delta=(field)=>{
    if(!latest||!prev||!latest[field]||!prev[field]) return '';
    const d=(latest[field]-prev[field]);
    const sign=d>0?'+':''; const cls=field==='weight'?(d<0?'dn':d>0?'up':'eq'):(d<0?'dn':d>0?'up':'eq');
    return `<div class="ps-d ${cls}">${sign}${d.toFixed(1)}</div>`;
  };

  el.innerHTML=`
  <div class="prog-hero">
    <div class="prog-title">📈 Мой прогресс</div>
    <div class="prog-sub">Отслеживайте изменения тела</div>
    <div class="prog-stats">
      <div class="ps"><div class="ps-v">${latest?latest.weight||'—':'—'}</div><div class="ps-l">Вес, кг</div>${delta('weight')}</div>
      <div class="ps"><div class="ps-v">${latest?latest.waist||'—':'—'}</div><div class="ps-l">Талия, см</div>${delta('waist')}</div>
      <div class="ps"><div class="ps-v">${latest?latest.hips||'—':'—'}</div><div class="ps-l">Бёдра, см</div>${delta('hips')}</div>
    </div>
  </div>

  ${progEntries.length>1?renderChart():''}

  <div class="add-form">
    <div class="lbl" style="margin-bottom:12px">➕ Добавить замер</div>
    <div class="fld"><label>Дата</label><input type="date" id="pe-date" value="${today()}"/></div>
    <div class="frow3">
      <div class="fld"><label>Вес (кг)</label><input type="number" id="pe-w" placeholder="70" inputmode="decimal" step="0.1"/></div>
      <div class="fld"><label>Талия</label><input type="number" id="pe-waist" placeholder="80" inputmode="numeric"/></div>
      <div class="fld"><label>Бёдра</label><input type="number" id="pe-hips" placeholder="100" inputmode="numeric"/></div>
    </div>
    <div class="fld"><label>Фото (необязательно)</label>
      <div class="photo-upload-area" id="pe-photo-area" onclick="document.getElementById('pe-photo-file').click()">
        <span style="font-size:24px">📷</span>
        <span>Нажмите, чтобы добавить фото</span>
        <input type="file" id="pe-photo-file" accept="image/*" onchange="onProgPhoto(event)" style="display:none"/>
      </div>
    </div>
    <button class="btn btn-p mt8" onclick="addEntry()">Сохранить замер</button>
  </div>

  ${progEntries.length>0?`
  <div class="card">
    <div class="lbl">История замеров</div>
    ${[...progEntries].reverse().map((e,i)=>`
    <div class="pe">
      <div class="pe-head">
        <div class="pe-photo" onclick="${e.photo?`showPhoto('${i}')`:''}">${e.photo?`<img src="${e.photo}"/>`:'📅'}</div>
        <div class="pe-info">
          <div class="pe-date">${formatDate(e.date)}</div>
          <div class="pe-vals">
            ${e.weight?`<div class="pe-val">⚖️ <span>${e.weight}</span> кг</div>`:''}
            ${e.waist?`<div class="pe-val">📏 <span>${e.waist}</span> см</div>`:''}
            ${e.hips?`<div class="pe-val">🍑 <span>${e.hips}</span> см</div>`:''}
          </div>
        </div>
        <div class="pe-del" onclick="deleteEntry(${progEntries.length-1-i})">🗑️</div>
      </div>
      ${e.photo?`<img class="pe-imgbig" src="${e.photo}"/>`:''}
    </div>`).join('')}
  </div>`:'<div class="empty"><div class="empty-ico">📏</div><p>Добавьте первый замер,<br>чтобы начать отслеживание</p></div>'}`;
}

function renderChart(){
  const data=progEntries.filter(e=>e[chartMetric]);
  if(data.length<2) return '';
  const vals=data.map(e=>parseFloat(e[chartMetric]));
  const min=Math.min(...vals)-1, max=Math.max(...vals)+1;
  const W=340,H=100,pad=30;
  const x=(i)=>pad+(i/(data.length-1))*(W-pad*2);
  const y=(v)=>H-pad-((v-min)/(max-min||1))*(H-pad*1.5);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const labels={weight:'Вес (кг)',waist:'Талия (см)',hips:'Бёдра (см)'};
  return`<div class="chart-wrap">
    <div class="lbl">График</div>
    <div class="chart-tabs">
      <button class="ct ${chartMetric==='weight'?'on':''}" onclick="setChart('weight')">Вес</button>
      <button class="ct ${chartMetric==='waist'?'on':''}" onclick="setChart('waist')">Талия</button>
      <button class="ct ${chartMetric==='hips'?'on':''}" onclick="setChart('hips')">Бёдра</button>
    </div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#EC4899"/></linearGradient></defs>
      ${vals.map((v,i)=>`<line x1="${x(i)}" y1="${y(v)}" x2="${x(i)}" y2="${H-pad/2}" stroke="rgba(124,58,237,.1)" stroke-width="1"/>`).join('')}
      <polyline points="${pts}" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="url(#lg)"/>
        <text x="${x(i)}" y="${y(v)-8}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--text3)">${v}</text>
        <text x="${x(i)}" y="${H-4}" text-anchor="middle" font-size="8" fill="var(--text3)">${data[i].date.slice(5)}</text>`).join('')}
    </svg>
  </div>`;
}

function setChart(m){chartMetric=m;renderProg();}

let tempProgPhoto=null;
function onProgPhoto(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=ev=>{
    tempProgPhoto=ev.target.result;
    const area=document.getElementById('pe-photo-area');
    area.innerHTML=`<img src="${tempProgPhoto}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px"/><input type="file" id="pe-photo-file" accept="image/*" onchange="onProgPhoto(event)" style="display:none"/>`;
  };
  r.readAsDataURL(file);
}

function addEntry(){
  const date=document.getElementById('pe-date').value||today();
  const weight=parseFloat(document.getElementById('pe-w').value)||null;
  const waist=parseFloat(document.getElementById('pe-waist').value)||null;
  const hips=parseFloat(document.getElementById('pe-hips').value)||null;
  if(!weight&&!waist&&!hips){showToast('⚠️ Введите хотя бы один параметр');return;}
  const existing=progEntries.findIndex(e=>e.date===date);
  const entry={date,weight,waist,hips,photo:tempProgPhoto||null};
  if(existing>=0) progEntries[existing]=entry; else progEntries.push(entry);
  progEntries.sort((a,b)=>a.date.localeCompare(b.date));
  save('k52_entries',progEntries);
  tempProgPhoto=null;
  showToast('✅ Замер сохранён!');
  renderProg();
}

function deleteEntry(i){
  progEntries.splice(i,1);
  save('k52_entries',progEntries);
  renderProg();
}

function formatDate(d){
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}

  const totalF=foodLog.reduce((s,f)=>s+f.f,0);
  const totalC=foodLog.reduce((s,f)=>s+f.c,0);

  const pct=Math.min(100,Math.round(totalKcal/target*100));

  el.innerHTML=`
  <div class="ptitle">Счётчик калорий 🧮</div>
  <div class="daily-total">

  </div>

  <div class="food-log" id="food-log-list">
    ${foodLog.length===0?`<div class="empty"><div class="empty-ico">🍽️</div><p>Пока ничего не добавлено.<br>Начните вводить продукты выше.</p></div>`:

    <div class="fl-item">
      <div class="fl-icon">${f.emoji}</div>
      <div class="fl-info">
        <div class="fl-name">${f.name}</div>
        <div class="fl-detail">${f.portion} ${f.unit}</div>
        <div class="fl-macs">
          <span class="fl-mac fl-mac-p">Б: ${f.p.toFixed(1)}г</span>
          <span class="fl-mac fl-mac-f">Ж: ${f.f.toFixed(1)}г</span>
          <span class="fl-mac fl-mac-c">У: ${f.c.toFixed(1)}г</span>
        </div>
      </div>
      <div class="fl-kcal">${f.kcal} ккал</div>
      <div class="fl-del" onclick="removeFood(${i})">✕</div>
    </div>`).join('')}
    ${foodLog.length>0?`<button class="btn btn-ghost mt8" onclick="clearLog()">Очистить за сегодня 🗑️</button>`:''}</div>`;

  updatePortionPreview();
}

function searchFood(){
  const q=document.getElementById('food-search').value.toLowerCase().trim();
  const res=document.getElementById('food-results');
  if(q.length<2){res.classList.remove('show');return;}
  const found=FOODS.filter(f=>f.name.toLowerCase().includes(q)).slice(0,6);
  if(!found.length){res.innerHTML='<div class="fri"><span class="fri-name">Ничего не найдено</span></div>';res.classList.add('show');return;}
  res.innerHTML=found.map(f=>`<div class="fri" onclick="selectFood('${f.name}')"><div><div class="fri-name">${f.emoji} ${f.name}</div><div style="font-size:11px;font-weight:700;color:var(--text3)">на 100 ${f.unit}: ${f.p}г Б · ${f.f}г Ж · ${f.c}г У</div></div><div class="fri-kcal">${f.kcal} ккал</div></div>`).join('');
  res.classList.add('show');
}

function selectFood(name){
  selectedFood=FOODS.find(f=>f.name===name);
  if(!selectedFood) return;
  document.getElementById('food-results').classList.remove('show');
  document.getElementById('food-search').value='';
  document.getElementById('sel-food-name').textContent=`${selectedFood.emoji} ${selectedFood.name}`;
  document.getElementById('portion-unit-lbl').textContent=selectedFood.unit;
  document.getElementById('portion-block').style.display='block';
  document.getElementById('portion-g').value='100';
  updatePortionPreview();
}

function updatePortionPreview(){
  if(!selectedFood) return;
  const g=parseFloat(document.getElementById('portion-g').value)||0;
  const ratio=g/100;
  const kcal=Math.round(selectedFood.kcal*ratio);
  const p=(selectedFood.p*ratio).toFixed(1);
  const f=(selectedFood.f*ratio).toFixed(1);
  const c=(selectedFood.c*ratio).toFixed(1);
  document.getElementById('portion-preview').innerHTML=`<span style="color:var(--purple);font-weight:900">${kcal} ккал</span> · Б:${p}г · Ж:${f}г · У:${c}г`;
}

function addFood(){
  if(!selectedFood) return;
  const g=parseFloat(document.getElementById('portion-g').value)||100;
  const ratio=g/100;
  const item={
    name:selectedFood.name, emoji:selectedFood.emoji,
    portion:g, unit:selectedFood.unit,
    kcal:Math.round(selectedFood.kcal*ratio),
    p:parseFloat((selectedFood.p*ratio).toFixed(1)),
    f:parseFloat((selectedFood.f*ratio).toFixed(1)),
    c:parseFloat((selectedFood.c*ratio).toFixed(1)),
  };
  foodLog.push(item);
  save('k52_foodlog_'+today(),foodLog);
  selectedFood=null;
  document.getElementById('portion-block').style.display='none';
  showToast('✅ Добавлено: '+item.name);
  renderCalc();
}

function removeFood(i){
  foodLog.splice(i,1);
  save('k52_foodlog_'+today(),foodLog);
  renderCalc();
}

function clearLog(){
  foodLog=[];
  save('k52_foodlog_'+today(),foodLog);
  renderCalc();
}

// ═══════════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════════
function closeModal(e){
  if(!e||e.target===document.getElementById('modal-ov')) document.getElementById('modal-ov').classList.remove('on');
}

// ═══════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2400);
}
</script>
</body>
</html>
