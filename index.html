<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calorie App</title>

<style>
body { font-family: Arial; background:#111; color:#fff; padding:20px; }
.btn { padding:12px; background:#4CAF50; border:none; color:#fff; cursor:pointer; margin:10px 0; }
.card { background:#222; padding:15px; border-radius:10px; margin-top:10px; }
.fri { padding:10px; border-bottom:1px solid #333; cursor:pointer; }
.fri:hover { background:#333; }
</style>
</head>

<body>

<h2>Калькулятор калорий</h2>

<button class="btn" onclick="openCamera()">📸 Распознать еду</button>

<input type="file" id="food-photo" accept="image/*" capture="environment"
style="display:none" onchange="analyzeFood(event)">

<div id="calc-b"></div>

<script>

// 🔥 ТВОЯ БАЗА (пример, можешь расширить)
const FOODS = [
  {n:"apple", k:52},
  {n:"banana", k:89},
  {n:"pizza", k:266},
  {n:"egg", k:155},
  {n:"chicken", k:239}
];

// 📸 открыть камеру
function openCamera(){
  document.getElementById('food-photo').click();
}

// 🧠 отправка фото
async function analyzeFood(event){
  const file = event.target.files[0];
  if(!file) return;

  const formData = new FormData();
  formData.append('image', file);

  document.getElementById("calc-b").innerHTML = "⏳ Распознаю...";

  try{
    const res = await fetch("https://food-ai-server-dzk1.onrender.com/analyze", {
      method: "POST",
      body: formData
    });

    const data = await res.json();
    showChoices(data.foods);

  }catch(e){
    document.getElementById("calc-b").innerHTML = "Ошибка 😢";
  }
}

// 📋 показать варианты
function showChoices(foods){
  let html = "<div class='card'><b>Что это?</b>";

  foods.forEach(f=>{
    html += `<div class="fri" onclick="selectFood('${f}')">${f}</div>`;
  });

  html += "</div>";

  document.getElementById("calc-b").innerHTML = html;
}

// 🔗 выбор продукта
function selectFood(name){
  const found = FOODS.find(f =>
    name.toLowerCase().includes(f.n.toLowerCase())
  );

  if(!found){
    alert("Не найдено 😢");
    return;
  }

  const grams = prompt("Сколько грамм?", "100");
  if(!grams) return;

  const kcal = Math.round(found.k * grams / 100);

  alert(`${found.n}\n${grams} г\n🔥 ${kcal} ккал`);
}

</script>

</body>
</html>
