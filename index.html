<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Калории 52"/>
<title>Калории 52</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --c1: #FF6B6B; --c2: #FF8E53; --c3: #FFC107; --c4: #4ECDC4; --c5: #45B7D1;
  --green: #2ECC71; --green2: #27ae60; --greenl: #d5f5e3;
  --purple: #9B59B6; --pink: #E91E8C;
  --text: #1a1a2e; --text2: #555577; --text3: #9999bb;
  --bg: #f0f2ff; --surface: #ffffff;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15);
  --r: 18px; --r-sm: 12px;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.15);
}
@media(prefers-color-scheme:dark){:root{
  --text:#e8e8ff;--text2:#aaaacc;--text3:#666699;
  --bg:#0d0d1a;--surface:#1a1a2e;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --shadow:0 4px 20px rgba(0,0,0,0.4);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Nunito',sans-serif;color:var(--text);background:var(--bg);overflow:hidden}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto;position:relative}

/* HEADER */
.header{
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  padding:52px 20px 16px;
  position:relative;overflow:hidden;
}
.header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,0.1);border-radius:50%}
.header::after{content:'';position:absolute;bottom:-60px;left:-20px;width:200px;height:200px;background:rgba(255,255,255,0.06);border-radius:50%}
.header-inner{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;font-weight:900;color:#fff;letter-spacing:-0.5px}
.logo span{color:#FFD700}
.header-sub{font-size:13px;color:rgba(255,255,255,0.75);margin-top:2px;font-weight:600}
.header-avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:2px solid rgba(255,255,255,0.3)}

/* NAV */
.bottom-nav{background:var(--surface);border-top:0.5px solid var(--border);display:flex;padding:8px 0 max(20px,env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;border:none;background:none;color:var(--text3);font-size:10px;font-family:'Nunito',sans-serif;font-weight:700;transition:all .2s}
.nav-item.active{color:var(--purple)}
.nav-icon{font-size:22px;line-height:1;transition:transform .2s}
.nav-item.active .nav-icon{transform:scale(1.15)}

/* CONTENT */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.page{display:none}.page.active{display:block}

/* CARDS */
.card{background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.section-label{font-size:11px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);margin-bottom:12px}

/* GRADIENT CARDS */
.gradient-card{border-radius:var(--r);padding:18px;margin-bottom:14px;color:#fff;position:relative;overflow:hidden}
.gradient-card::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,0.15);border-radius:50%}

/* FIELDS */
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:7px}
.field input,.field select{
  width:100%;padding:13px 16px;font-size:16px;font-family:'Nunito',sans-serif;font-weight:600;
  border:2px solid var(--border2);border-radius:var(--r-sm);
  background:var(--bg);color:var(--text);transition:border-color .2s;
  -webkit-appearance:none;appearance:none;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--purple)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* SEGMENT */
.segment{display:flex;background:var(--bg);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg-btn{flex:1;padding:10px 4px;text-align:center;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;border-radius:9px;cursor:pointer;color:var(--text3);border:none;background:none;transition:all .2s}
.seg-btn.sel{background:var(--surface);color:var(--purple);box-shadow:0 2px 8px rgba(0,0,0,0.12)}

/* BUTTONS */
.btn{width:100%;padding:16px;font-size:16px;font-weight:900;font-family:'Nunito',sans-serif;border:none;border-radius:var(--r);cursor:pointer;transition:all .2s;letter-spacing:0.3px}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 15px rgba(102,126,234,0.4)}
.btn-primary:active{transform:scale(0.98);box-shadow:0 2px 8px rgba(102,126,234,0.3)}
.btn-green{background:linear-gradient(135deg,#2ECC71,#27ae60);color:#fff;box-shadow:0 4px 15px rgba(46,204,113,0.3)}
.btn-mt{margin-top:10px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{border-radius:var(--r);padding:16px;position:relative;overflow:hidden}
.stat-card-1{background:linear-gradient(135deg,#FF6B6B,#FF8E53)}
.stat-card-2{background:linear-gradient(135deg,#667eea,#764ba2)}
.stat-card-3{background:linear-gradient(135deg,#2ECC71,#1abc9c)}
.stat-card-4{background:linear-gradient(135deg,#FFC107,#FF8E53)}
.stat-label{font-size:11px;font-weight:700;color:rgba(255,255,255,0.75);margin-bottom:6px}
.stat-value{font-size:26px;font-weight:900;color:#fff;line-height:1}
.stat-unit{font-size:12px;font-weight:600;color:rgba(255,255,255,0.8);margin-left:3px}

/* KCAL GOAL CARDS */
.goal-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.goal-card{border-radius:var(--r-sm);padding:13px 8px;text-align:center;cursor:pointer;border:2.5px solid var(--border);background:var(--surface);transition:all .2s;box-shadow:var(--shadow)}
.goal-card.sel{border-color:var(--purple);background:linear-gradient(135deg,rgba(102,126,234,0.12),rgba(118,75,162,0.12))}
.goal-title{font-size:11px;font-weight:800;color:var(--text3);margin-bottom:4px}
.goal-card.sel .goal-title{color:var(--purple)}
.goal-num{font-size:21px;font-weight:900;color:var(--text)}
.goal-card.sel .goal-num{color:var(--purple)}
.goal-sub{font-size:10px;color:var(--text3);font-weight:700;margin-top:2px}

/* MACROS */
.macro{margin-bottom:14px}
.macro-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.macro-name{font-size:14px;font-weight:700;color:var(--text2)}
.macro-val{font-size:14px;font-weight:900}
.bar-bg{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .6s ease}

/* RECIPE CARDS */
.recipe-grid{display:grid;gap:12px}
.recipe-card{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s}
.recipe-card:active{transform:scale(0.98);box-shadow:var(--shadow-lg)}
.recipe-img{width:100%;height:160px;object-fit:cover;background:var(--bg);display:block}
.recipe-img-placeholder{width:100%;height:160px;display:flex;align-items:center;justify-content:center;font-size:64px}
.recipe-body{padding:14px}
.recipe-name{font-size:16px;font-weight:800;color:var(--text);margin-bottom:6px}
.recipe-row{display:flex;align-items:center;justify-content:space-between}
.recipe-tags{display:flex;gap:5px;flex-wrap:wrap}
.recipe-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--text3)}
.recipe-kcal-badge{font-size:15px;font-weight:900;color:#fff;padding:4px 12px;border-radius:99px;background:linear-gradient(135deg,var(--c1),var(--c2));white-space:nowrap}
.recipe-macros{display:flex;gap:10px;margin-top:10px}
.recipe-macro{text-align:center;flex:1;background:var(--bg);border-radius:8px;padding:7px 4px}
.recipe-macro-val{font-size:14px;font-weight:900;color:var(--text)}
.recipe-macro-name{font-size:10px;font-weight:700;color:var(--text3)}

/* FIT BADGE */
.fit-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.fit-perfect{background:#d5f5e3;color:#27ae60}
.fit-good{background:#fef9e7;color:#f39c12}
.fit-high{background:#fde8e8;color:#e74c3c}

/* FILTERS */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;border-radius:99px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;white-space:nowrap;cursor:pointer;border:2px solid var(--border2);color:var(--text2);background:var(--surface);transition:all .2s;flex-shrink:0}
.chip.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(102,126,234,0.35)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal-overlay.show .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:99px;margin:14px auto 0}
.modal-img{width:100%;height:220px;object-fit:cover;display:block}
.modal-img-placeholder{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:80px;background:var(--bg)}
.modal-content{padding:18px 20px 40px}
.modal-kcal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal-title{font-size:22px;font-weight:900;color:var(--text);margin-bottom:6px}
.modal-big-kcal{font-size:36px;font-weight:900;background:linear-gradient(135deg,var(--c1),var(--c2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.macros-pills{display:flex;gap:8px;margin-bottom:18px}
.mpill{flex:1;text-align:center;border-radius:12px;padding:11px 4px}
.mpill-p{background:linear-gradient(135deg,#2ECC71,#1abc9c)}
.mpill-f{background:linear-gradient(135deg,#FFC107,#FF8E53)}
.mpill-c{background:linear-gradient(135deg,#45B7D1,#667eea)}
.mpill-val{font-size:20px;font-weight:900;color:#fff}
.mpill-name{font-size:11px;font-weight:700;color:rgba(255,255,255,0.8)}
.ingr-title,.steps-title{font-size:15px;font-weight:900;color:var(--text2);margin:16px 0 10px}
.ingr{font-size:14px;font-weight:600;color:var(--text);padding:9px 0;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px}
.ingr::before{content:'•';color:var(--purple);font-size:18px;font-weight:900}
.step{display:flex;gap:12px;margin-bottom:12px}
.step-num{min-width:28px;height:28px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;margin-top:1px}
.step-text{font-size:14px;font-weight:600;color:var(--text);line-height:1.5}

/* TOAST */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:11px 22px;border-radius:99px;font-size:14px;font-weight:700;font-family:'Nunito',sans-serif;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
.toast.show{opacity:1}

/* EMPTY */
.empty{text-align:center;padding:50px 20px}
.empty-icon{font-size:56px;margin-bottom:14px}
.empty p{font-size:15px;font-weight:600;color:var(--text3);line-height:1.6}
.empty a{color:var(--purple);cursor:pointer}

/* WELCOME BANNER */
.welcome-banner{border-radius:var(--r);padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;position:relative;overflow:hidden}
.welcome-banner::after{content:'🥗';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:52px;opacity:0.3}
.welcome-name{font-size:22px;font-weight:900;margin-bottom:4px}
.welcome-sub{font-size:13px;font-weight:600;opacity:0.8}

.page-title{font-size:24px;font-weight:900;margin-bottom:16px;letter-spacing:-0.3px}

input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="logo">Калории <span>52</span></div>
        <div class="header-sub" id="header-sub">Ваш личный нутрициолог</div>
      </div>
      <div class="header-avatar" id="header-avatar" onclick="showPage('profile')">👤</div>
    </div>
  </div>

  <div class="content" id="main-content">
    <!-- PROFILE -->
    <div id="page-profile" class="page active">
      <div class="card">
        <div class="section-label">Личные данные</div>
        <div class="field-row">
          <div class="field"><label>Имя</label><input type="text" id="name" placeholder="Ваше имя"/></div>
          <div class="field"><label>Возраст</label><input type="number" id="age" placeholder="30" inputmode="numeric"/></div>
        </div>
        <div class="field"><label>Пол</label>
          <div class="segment">
            <button class="seg-btn sel" id="g-male" onclick="setGender('male')">Мужской</button>
            <button class="seg-btn" id="g-female" onclick="setGender('female')">Женский</button>
          </div>
        </div>
        <div class="field"><label>Рост (см)</label><input type="number" id="height" placeholder="170" inputmode="numeric"/></div>
      </div>

      <div class="card">
        <div class="section-label">Размеры тела</div>
        <div class="field-row">
          <div class="field"><label>Вес (кг)</label><input type="number" id="weight" placeholder="70" inputmode="decimal" step="0.1"/></div>
          <div class="field"><label>Талия (см)</label><input type="number" id="waist" placeholder="80" inputmode="numeric"/></div>
        </div>
        <div class="field"><label>Бёдра (см)</label><input type="number" id="hips" placeholder="100" inputmode="numeric"/></div>
      </div>

      <div class="card">
        <div class="section-label">Активность</div>
        <div class="field">
          <select id="activity">
            <option value="1.2">😴 Сидячий образ жизни</option>
            <option value="1.375">🚶 Лёгкая (1–3 тренировки/нед.)</option>
            <option value="1.55" selected>🏃 Умеренная (3–5 тренировок)</option>
            <option value="1.725">💪 Высокая (6–7 тренировок)</option>
            <option value="1.9">🔥 Очень высокая (физический труд)</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="section-label">Моя цель</div>
        <div class="segment">
          <button class="seg-btn" id="goal-lose" onclick="setGoal('lose')">🔻 Минус</button>
          <button class="seg-btn sel" id="goal-maintain" onclick="setGoal('maintain')">⚖️ Норма</button>
          <button class="seg-btn" id="goal-gain" onclick="setGoal('gain')">💪 Масса</button>
        </div>
      </div>

      <button class="btn btn-primary" onclick="saveProfile()">Рассчитать мой план ✨</button>
    </div>

    <!-- DASHBOARD -->
    <div id="page-dashboard" class="page">
      <div id="dashboard-content"></div>
    </div>

    <!-- RECIPES -->
    <div id="page-recipes" class="page">
      <div id="recipes-content"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" id="nav-profile" onclick="showPage('profile')">
      <span class="nav-icon">👤</span>Профиль
    </button>
    <button class="nav-item" id="nav-dashboard" onclick="showPage('dashboard')">
      <span class="nav-icon">📊</span>Мой план
    </button>
    <button class="nav-item" id="nav-recipes" onclick="showPage('recipes')">
      <span class="nav-icon">🍽️</span>Рецепты
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-el">
    <div class="modal-handle"></div>
    <div id="modal-inner"></div>
  </div>
</div>

<script>
// ── DATA ───────────────────────────────────────────────────────────────────
const RECIPES = [
  // ЗАВТРАКИ
  {
    id:1, meal:'breakfast', name:'Овсянка с бананом и орехами', emoji:'🥣',
    img:'https://images.unsplash.com/photo-1517673400267-0251440c45dc?w=600&q=80',
    basePct:0.25, tags:['Завтрак','Быстро','Вегет.'],
    p:12, f:14, c:52, kcal:380,

    steps:['Залейте овсянку горячим молоком, накройте на 5 мин.','Нарежьте банан кружочками.','Добавьте орехи и мёд. Подавайте тёплым.']
  },
  {
    id:2, meal:'breakfast', name:'Яичница с авокадо и тостом', emoji:'🍳',
    img:'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=600&q=80',
    basePct:0.25, tags:['Завтрак','Белковое'],
    p:18, f:22, c:32, kcal:420,
    ingredients:['Яйца — 2 шт','Авокадо — ½ шт','Цельнозерновой хлеб — 1 ломтик','Оливковое масло — 1 ч.л.','Соль, перец'],
    steps:['Разогрейте сковороду с маслом.','Разбейте яйца, жарьте 3–4 мин.','Авокадо разомните, посолите, выложите на тост.','Подавайте вместе.']
  },
  {
    id:3, meal:'breakfast', name:'Греческий йогурт с ягодами', emoji:'🫐',

  {

    img:'https://images.unsplash.com/photo-1565299543923-37dd37887442?w=600&q=80',
    basePct:0.25, tags:['Завтрак','Белковое','ПП'],
    p:28, f:8, c:40, kcal:350,
    ingredients:['Творог 5% — 200 г','Яйца — 2 шт','Протеин ванильный — 30 г','Банан — ½ шт','Разрыхлитель — ½ ч.л.'],
    steps:['Все ингредиенты взбейте блендером до однородности.','Жарьте на антипригарной сковороде без масла по 2 мин с каждой стороны.','Подавайте с ягодами или мёдом.']
  },
  {
    id:5, meal:'breakfast', name:'Смузи-боул с манго', emoji:'🥭',
    img:'https://images.unsplash.com/photo-1511690743698-d9d85f2fbf38?w=600&q=80',
    basePct:0.22, tags:['Завтрак','Вегет.','Лёгкое'],
    p:8, f:6, c:55, kcal:310,
    ingredients:['Манго замороженный — 150 г','Банан — 1 шт','Кокосовое молоко — 100 мл','Гранола — 30 г','Кокосовая стружка — 10 г','Киви — 1 шт'],
    steps:['Взбейте манго, банан и молоко в блендере до густой консистенции.','Вылейте в глубокую тарелку.','Украсьте гранолой, стружкой и ломтиками киви.']
  },

// ── STATE ──────────────────────────────────────────────────────────────────
let gender = 'male', userGoal = 'maintain', activeFilter = 'all', profile = null;

// ── INIT ───────────────────────────────────────────────────────────────────
(function init() {
  try {
    const s = localStorage.getItem('k52_profile');
    if (s) { profile = JSON.parse(s); gender = profile.gender; userGoal = profile.userGoal; fillForm(); updateHeader(); }
  } catch(e) {}
  ['g-male','g-female','goal-lose','goal-maintain','goal-gain'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('sel');
  });
  document.getElementById('g-'+gender).classList.add('sel');
  document.getElementById('goal-'+userGoal).classList.add('sel');
})();

function fillForm() {
  if (!profile) return;
  ['name','age','height','weight','waist','hips'].forEach(f => {
    const el = document.getElementById(f);
    if (el && profile[f]) el.value = profile[f];
  });
  document.getElementById('activity').value = profile.act || 1.55;
}

function updateHeader() {
  if (!profile) return;
  document.getElementById('header-sub').textContent = profile.name ? `Привет, ${profile.name}! 👋` : 'Ваш личный нутрициолог';
  document.getElementById('header-avatar').textContent = gender === 'female' ? '👩' : '👨';
}

function setGender(g) {
  gender = g;
  document.getElementById('g-male').classList.toggle('sel', g === 'male');
  document.getElementById('g-female').classList.toggle('sel', g === 'female');
}
function setGoal(g) {
  userGoal = g;
  ['lose','maintain','gain'].forEach(x => document.getElementById('goal-'+x).classList.toggle('sel', x === g));
}

// ── CALC ───────────────────────────────────────────────────────────────────
function bmr(w,h,a,g){ return g==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161 }

// Scale recipe kcal based on user's target calories for that meal
function scaleRecipe(r, targetDayCals) {
  const mealTarget = targetDayCals * r.basePct;
  const ratio = mealTarget / r.kcal;
  // clamp ratio 0.7–1.5 so it's realistic
  const clampedRatio = Math.min(1.5, Math.max(0.7, ratio));
  return {
    ...r,
    kcalScaled: Math.round(r.kcal * clampedRatio),
    pScaled: Math.round(r.p * clampedRatio),
    fScaled: Math.round(r.f * clampedRatio),
    cScaled: Math.round(r.c * clampedRatio),
    ratio: clampedRatio,
    fitDiff: Math.abs(r.kcal * clampedRatio - mealTarget)
  };
}

function fitLabel(diff) {
  if (diff < 30) return {cls:'fit-perfect', txt:'✅ Отлично подходит'};
  if (diff < 80) return {cls:'fit-good', txt:'👍 Хорошо подходит'};
  return {cls:'fit-high', txt:'⚠️ Можно скорректировать'};
}

function saveProfile() {
  const w = parseFloat(document.getElementById('weight').value);
  const h = parseFloat(document.getElementById('height').value);
  const a = parseFloat(document.getElementById('age').value);
  if (!w || !h || !a) { showToast('⚠️ Введите вес, рост и возраст'); return; }
  const waist = parseFloat(document.getElementById('waist').value)||0;
  const hips  = parseFloat(document.getElementById('hips').value)||0;
  const act   = parseFloat(document.getElementById('activity').value);
  const name  = document.getElementById('name').value || 'Пользователь';
  const tdee  = Math.round(bmr(w,h,a,gender)*act);
  const bmiV  = w/((h/100)**2);
  profile = {
    name, w, h, a, waist, hips, gender, act, userGoal,
    tdee, bmrV: Math.round(bmr(w,h,a,gender)),
    bmi: bmiV, loseCals: tdee-500, gainCals: tdee+300
  };
  try { localStorage.setItem('k52_profile', JSON.stringify(profile)); } catch(e) {}
  updateHeader();
  showToast('✅ Профиль сохранён!');
  setTimeout(() => showPage('dashboard'), 700);
}

// ── PAGES ──────────────────────────────────────────────────────────────────
function showPage(p) {
  ['profile','dashboard','recipes'].forEach(x => {
    document.getElementById('page-'+x).classList.toggle('active', x===p);
    document.getElementById('nav-'+x).classList.toggle('active', x===p);
  });
  if (p==='dashboard') renderDashboard();
  if (p==='recipes') renderRecipes();
}

// ── DASHBOARD ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const el = document.getElementById('dashboard-content');
  if (!profile) {
    el.innerHTML=`<div class="empty"><div class="empty-icon">📊</div><p>Заполните <a onclick="showPage('profile')">профиль</a>, чтобы увидеть ваш план.</p></div>`;
    return;
  }
  const {name,w,bmi,tdee,bmrV,loseCals,gainCals,userGoal:uG} = profile;
  const cals = uG==='lose'?loseCals:uG==='gain'?gainCals:tdee;
  const prot = Math.round(w*1.8), fat=Math.round(cals*.25/9), carb=Math.round((cals-prot*4-fat*9)/4);
  const bmiLbl = bmi<18.5?'Недовес':bmi<25?'Норма ✅':bmi<30?'Избыток':'Ожирение';
  const pPct=Math.min(100,Math.round(prot*4*100/cals)), fPct=Math.min(100,Math.round(fat*9*100/cals)), cPct=Math.min(100,Math.round(carb*4*100/cals));
  el.innerHTML=`
    <div class="welcome-banner">
      <div class="welcome-name">Привет, ${name}! 👋</div>
      <div class="welcome-sub">Ваш план питания готов</div>
    </div>
    <div class="stats-grid">
      <div class="stat-card stat-card-1"><div class="stat-label">ИМТ</div><div class="stat-value">${bmi.toFixed(1)}<span class="stat-unit">${bmiLbl}</span></div></div>
      <div class="stat-card stat-card-2"><div class="stat-label">Базовый обмен</div><div class="stat-value">${bmrV}<span class="stat-unit">ккал</span></div></div>
      <div class="stat-card stat-card-3"><div class="stat-label">TDEE</div><div class="stat-value">${tdee}<span class="stat-unit">ккал</span></div></div>
      <div class="stat-card stat-card-4"><div class="stat-label">Вес</div><div class="stat-value">${w}<span class="stat-unit">кг</span></div></div>
    </div>
    <div class="card">
      <div class="section-label">Выберите цель</div>
      <div class="goal-row">
        <div class="goal-card ${uG==='lose'?'sel':''}" onclick="selectGoal('lose')"><div class="goal-title">🔻 Похудение</div><div class="goal-num">${loseCals}</div><div class="goal-sub">ккал/день</div></div>
        <div class="goal-card ${uG==='maintain'?'sel':''}" onclick="selectGoal('maintain')"><div class="goal-title">⚖️ Поддержание</div><div class="goal-num">${tdee}</div><div class="goal-sub">ккал/день</div></div>
        <div class="goal-card ${uG==='gain'?'sel':''}" onclick="selectGoal('gain')"><div class="goal-title">💪 Набор</div><div class="goal-num">${gainCals}</div><div class="goal-sub">ккал/день</div></div>
      </div>
    </div>
    <div class="card">
      <div class="section-label">Макросы — ${cals} ккал/день</div>
      <div class="macro"><div class="macro-header"><span class="macro-name">🥩 Белки</span><span class="macro-val" style="color:var(--green)">${prot} г</span></div><div class="bar-bg"><div class="bar-fill" style="width:${pPct}%;background:linear-gradient(90deg,#2ECC71,#1abc9c)"></div></div></div>
      <div class="macro"><div class="macro-header"><span class="macro-name">🥑 Жиры</span><span class="macro-val" style="color:#FFC107">${fat} г</span></div><div class="bar-bg"><div class="bar-fill" style="width:${fPct}%;background:linear-gradient(90deg,#FFC107,#FF8E53)"></div></div></div>
      <div class="macro"><div class="macro-header"><span class="macro-name">🍚 Углеводы</span><span class="macro-val" style="color:#45B7D1">${carb} г</span></div><div class="bar-bg"><div class="bar-fill" style="width:${cPct}%;background:linear-gradient(90deg,#45B7D1,#667eea)"></div></div></div>
    </div>
    <button class="btn btn-green btn-mt" onclick="showPage('recipes')">Посмотреть рецепты 🍽️</button>
  `;
}

function selectGoal(g) {
  if (!profile) return;
  profile.userGoal = g; userGoal = g;
  try { localStorage.setItem('k52_profile', JSON.stringify(profile)); } catch(e) {}
  renderDashboard();
}

// ── RECIPES ────────────────────────────────────────────────────────────────
function renderRecipes() {
  const el = document.getElementById('recipes-content');
  const targetCals = profile ? (profile.userGoal==='lose'?profile.loseCals:profile.userGoal==='gain'?profile.gainCals:profile.tdee) : null;
  const filters = [{id:'all',l:'Все'},{id:'breakfast',l:'Завтрак'},{id:'lunch',l:'Обед'},{id:'dinner',l:'Ужин'},{id:'snack',l:'Перекус'}];
  let list = RECIPES.filter(r => activeFilter==='all'||r.meal===activeFilter);
  let scaled = list.map(r => targetCals ? scaleRecipe(r, targetCals) : {...r, kcalScaled:r.kcal, pScaled:r.p, fScaled:r.f, cScaled:r.c, fitDiff:999});
  scaled.sort((a,b) => a.fitDiff - b.fitDiff);

  el.innerHTML = `
    <div class="page-title">Рецепты 🍽️</div>
    ${targetCals ? `<div style="font-size:13px;font-weight:700;color:var(--text3);margin-bottom:12px;">Подобраны под ваши <span style="color:var(--purple)">${targetCals} ккал/день</span> — порции рассчитаны индивидуально</div>` : ''}
    <div class="filters">
      ${filters.map(f=>`<div class="chip ${activeFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.l}</div>`).join('')}
    </div>
    <div class="recipe-grid">
      ${scaled.map(r => {
        const fit = targetCals ? fitLabel(r.fitDiff) : null;
        return `
        <div class="recipe-card" onclick="openRecipe(${r.id})">
          <img class="recipe-img" src="${r.img}" alt="${r.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy"/>
          <div class="recipe-img-placeholder" style="display:none">${r.emoji}</div>
          <div class="recipe-body">
            ${fit ? `<div class="fit-badge ${fit.cls}">${fit.txt}</div>` : ''}
            <div class="recipe-name">${r.emoji} ${r.name}</div>
            <div class="recipe-row">
              <div class="recipe-tags">${r.tags.map(t=>`<span class="recipe-tag">${t}</span>`).join('')}</div>
              <div class="recipe-kcal-badge">${r.kcalScaled} ккал</div>
            </div>
            <div class="recipe-macros">
              <div class="recipe-macro"><div class="recipe-macro-val" style="color:var(--green)">${r.pScaled}г</div><div class="recipe-macro-name">Белки</div></div>
              <div class="recipe-macro"><div class="recipe-macro-val" style="color:#FFC107">${r.fScaled}г</div><div class="recipe-macro-name">Жиры</div></div>
              <div class="recipe-macro"><div class="recipe-macro-val" style="color:#45B7D1">${r.cScaled}г</div><div class="recipe-macro-name">Углев.</div></div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function setFilter(f) { activeFilter=f; renderRecipes(); }

function openRecipe(id) {
  const r0 = RECIPES.find(x=>x.id===id);
  const targetCals = profile ? (profile.userGoal==='lose'?profile.loseCals:profile.userGoal==='gain'?profile.gainCals:profile.tdee) : null;
  const r = targetCals ? scaleRecipe(r0, targetCals) : {...r0, kcalScaled:r0.kcal, pScaled:r0.p, fScaled:r0.f, cScaled:r0.c};
  const fit = targetCals ? fitLabel(r.fitDiff) : null;
  document.getElementById('modal-inner').innerHTML=`
    <img class="modal-img" src="${r.img}" alt="${r.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" loading="lazy"/>
    <div class="modal-img-placeholder" style="display:none">${r.emoji}</div>
    <div class="modal-content">
      ${fit?`<div class="fit-badge ${fit.cls}" style="margin-bottom:10px">${fit.txt}</div>`:''}
      <div class="modal-title">${r.emoji} ${r.name}</div>
      <div class="modal-big-kcal">${r.kcalScaled} ккал</div>
      <div class="macros-pills">
        <div class="mpill mpill-p"><div class="mpill-val">${r.pScaled}г</div><div class="mpill-name">Белки</div></div>
        <div class="mpill mpill-f"><div class="mpill-val">${r.fScaled}г</div><div class="mpill-name">Жиры</div></div>
        <div class="mpill mpill-c"><div class="mpill-val">${r.cScaled}г</div><div class="mpill-name">Углев.</div></div>
      </div>
      <div class="ingr-title">🛒 Ингредиенты</div>
      ${r.ingredients.map(i=>`<div class="ingr">${i}</div>`).join('')}
      <div class="steps-title">👨‍🍳 Приготовление</div>
      ${r.steps.map((s,i)=>`<div class="step"><div class="step-num">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal(e) {
  if (!e||e.target===document.getElementById('modal-overlay')) document.getElementById('modal-overlay').classList.remove('show');
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2300);
}
</script>
</body>
</html>
